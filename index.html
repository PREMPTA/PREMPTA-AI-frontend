<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PREMPTA AI</title>
<meta name="description" content="PREMPTA AI agent ecosystem: configure agents, check readiness, analyze payroll and time records, and review PAGA compliance insights.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 6.5v8.2C4 22.4 9.2 27.9 16 30c6.8-2.1 12-7.6 12-15.3V6.5z' fill='%231d5fbf'/%3E%3Cpath d='M12 23V9.5h5.2a4.3 4.3 0 0 1 0 8.6H12' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>/* apply theme before paint */(function(){var t=null;try{t=localStorage.getItem('prempta-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t)})();</script>
<style>
/* PREMPTA · simplified client demo (index_3)
   Tokens follow the impeccable layer of index.html: OKLCH colour, IBM Plex,
   one elevation per surface (cards use a border, floating layers a shadow). */
:root{
  color-scheme:light;
  --font-sans:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --font-mono:"IBM Plex Mono",Consolas,"SFMono-Regular",Menlo,monospace;
  --fs-xs:12px;--fs-sm:13px;--fs-md:14px;--fs-lg:15px;--fs-xl:17px;--fs-2xl:20px;--fs-3xl:24px;--fs-4xl:30px;--fs-5xl:40px;
  --r-sm:6px;--r-md:8px;--r-lg:12px;--r-xl:16px;
  --ease:cubic-bezier(.16,1,.3,1);
  --bg:oklch(96.8% 0.006 258);--card:oklch(100% 0 0);--subtle:oklch(97.9% 0.005 258);--thead:oklch(97.5% 0.006 258);
  --hover:oklch(96.2% 0.014 258);--input:oklch(100% 0 0);--input-line:oklch(64.5% 0.022 258);
  --line:oklch(90.5% 0.011 258);--line-2:oklch(93.8% 0.008 258);
  --ink:oklch(24.5% 0.035 258);--ink-2:oklch(39% 0.03 258);--muted:oklch(48.5% 0.026 258);
  --accent:oklch(50.5% 0.16 258);--accent-h:oklch(44.5% 0.15 258);--accent-soft:oklch(95.2% 0.026 258);--on-accent:oklch(100% 0 0);
  --focus:oklch(58% 0.17 258);--teal:oklch(50% 0.095 182);--brand-ink:oklch(25.5% 0.055 258);
  --crit:oklch(50.5% 0.175 27);--crit-soft:oklch(95.8% 0.024 27);--crit-line:oklch(86% 0.06 27);
  --warn:oklch(50% 0.11 62);--warn-soft:oklch(96.2% 0.04 82);--warn-line:oklch(86% 0.07 82);
  --low:oklch(47.5% 0.06 258);--low-soft:oklch(95.6% 0.012 258);
  --good:oklch(47.5% 0.105 155);--good-soft:oklch(95.8% 0.03 155);--good-line:oklch(86% 0.06 155);
  --gap:oklch(48% 0.02 258);--gap-soft:oklch(95% 0.007 258);
  --bar-ok:oklch(70% 0.12 155);--bar-bad:oklch(60% 0.17 27);--bar-muted:oklch(88% 0.012 258);
  --pop:0 2px 6px -1px oklch(25% .04 258 / .10),0 16px 36px -10px oklch(25% .04 258 / .24);
  --selection:color-mix(in oklch,var(--accent) 24%,transparent);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:oklch(17.2% 0.026 258);--card:oklch(21.2% 0.029 258);--subtle:oklch(23.8% 0.031 258);--thead:oklch(22.8% 0.03 258);
  --hover:oklch(25.8% 0.036 258);--input:oklch(19.2% 0.027 258);--input-line:oklch(52.5% 0.035 258);
  --line:oklch(31% 0.033 258);--line-2:oklch(27.2% 0.031 258);
  --ink:oklch(95% 0.008 258);--ink-2:oklch(85.5% 0.015 258);--muted:oklch(73% 0.022 258);
  --accent:oklch(72% 0.13 258);--accent-h:oklch(78% 0.11 258);--accent-soft:oklch(29% 0.055 258);--on-accent:oklch(17% 0.03 258);
  --focus:oklch(74% 0.13 258);--teal:oklch(74% 0.11 182);--brand-ink:oklch(95% 0.008 258);
  --crit:oklch(73% 0.15 27);--crit-soft:oklch(27.5% 0.06 27);--crit-line:oklch(42% 0.09 27);
  --warn:oklch(82% 0.12 78);--warn-soft:oklch(27.5% 0.045 78);--warn-line:oklch(44% 0.07 78);
  --low:oklch(78% 0.05 258);--low-soft:oklch(27% 0.02 258);
  --good:oklch(79% 0.13 155);--good-soft:oklch(27% 0.045 155);--good-line:oklch(42% 0.07 155);
  --gap:oklch(77% 0.02 258);--gap-soft:oklch(27.5% 0.014 258);
  --bar-ok:oklch(68% 0.12 155);--bar-bad:oklch(66% 0.16 27);--bar-muted:oklch(34% 0.03 258);
  --pop:0 2px 6px -1px oklch(5% .02 258 / .5),0 18px 40px -10px oklch(5% .02 258 / .7);
  --selection:color-mix(in oklch,var(--accent) 34%,transparent);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;accent-color:var(--accent);scrollbar-color:var(--input-line) var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-md);line-height:1.5;font-kerning:normal;text-rendering:optimizeLegibility}
::selection{background:var(--selection);color:var(--ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1[tabindex="-1"]:focus{outline:none}
.nw{white-space:nowrap}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;color:var(--ink)}
h1{font-size:var(--fs-3xl);line-height:1.2;letter-spacing:-.02em}
h2{font-size:var(--fs-xl);line-height:1.3;letter-spacing:-.01em}
h3{font-size:var(--fs-lg);line-height:1.35}
p{margin:0;text-wrap:pretty}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--font-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px}
svg.i.lg{width:22px;height:22px}
[hidden]{display:none!important}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:8px 16px;border-radius:var(--r-md);border:1px solid transparent;
  font-size:var(--fs-sm);font-weight:600;line-height:1.2;text-decoration:none;white-space:nowrap;
  transition:background-color 120ms var(--ease),border-color 120ms var(--ease),color 120ms var(--ease),opacity 120ms var(--ease)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-h)}
.btn-primary[disabled]{opacity:.45;cursor:not-allowed}
.btn-secondary{background:var(--card);border-color:var(--input-line);color:var(--ink)}
.btn-secondary:hover{background:var(--hover)}
.btn-ghost{background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--hover);color:var(--ink)}
.btn-lg{min-height:46px;padding:11px 22px;font-size:var(--fs-lg)}
.btn-block{width:100%}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--r-md);border:1px solid transparent;background:transparent;color:var(--ink-2)}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.field{display:grid;gap:6px}
.field label{font-size:var(--fs-sm);font-weight:600;color:var(--ink-2)}
.input{width:100%;min-height:42px;padding:9px 12px;border-radius:var(--r-md);border:1px solid var(--input-line);background:var(--input);color:var(--ink);caret-color:var(--accent)}
.input:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.input[readonly]{background:var(--subtle);color:var(--ink-2)}

/* ---------- brand ---------- */
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--brand-ink)}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font-size:15px;letter-spacing:.14em;font-weight:700}
.brand b span{color:var(--teal);letter-spacing:.1em}

/* ---------- auth & setup (centered) ---------- */
.center{min-height:100vh;display:grid;place-items:center;padding:32px 16px}
.auth{width:min(400px,100%);display:grid;gap:28px}
.auth .brand{justify-self:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:28px}
.auth .panel{display:grid;gap:18px}
.auth h1{font-size:var(--fs-2xl)}
.auth-foot{text-align:center;font-size:var(--fs-xs);color:var(--muted)}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:0 24px;min-height:60px;display:flex;align-items:center;gap:20px}
.top .spacer{flex:1}
.org-chip{display:inline-flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border-radius:999px;background:var(--subtle);border:1px solid var(--line);font-size:var(--fs-sm);font-weight:600;color:var(--ink);max-width:260px}
.org-chip i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-style:normal;font-size:11px;font-weight:700;flex:none}
.org-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{display:flex;gap:4px}
.nav a{display:inline-flex;align-items:center;min-height:36px;padding:6px 12px;border-radius:var(--r-md);color:var(--ink-2);text-decoration:none;font-size:var(--fs-sm);font-weight:600}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.status{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-xs);font-weight:600;color:var(--good);white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.user{position:relative}
.avatar{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--brand-ink);color:var(--card);font-size:12px;font-weight:700;border:0}
:root[data-theme="dark"] .avatar{background:oklch(36% .07 258);color:var(--ink)}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--pop);padding:6px;display:grid}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line-2);margin-bottom:4px;font-size:var(--fs-sm)}
.menu .who b{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:var(--r-sm);border:0;background:transparent;font-size:var(--fs-sm)}
.menu button:hover{background:var(--hover)}
main{max-width:1200px;margin:0 auto;padding:32px 24px 64px}

/* ---------- stepper ---------- */
.steps{display:flex;align-items:center;gap:8px;list-style:none;margin:0;padding:0;font-size:var(--fs-sm)}
.steps li{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500}
.steps li+li::before{content:"";width:28px;height:1px;background:var(--line)}
.steps .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);font-size:12px;font-weight:600;background:var(--card)}
.steps .on{color:var(--ink);font-weight:600}
.steps .on .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.steps .done .n{background:var(--good-soft);border-color:var(--good-line);color:var(--good)}

/* ---------- page heads ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.head p{color:var(--ink-2);margin-top:6px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);text-decoration:none;font-size:var(--fs-sm);font-weight:600;margin-bottom:10px}
.back:hover{color:var(--accent)}

/* ---------- org setup ---------- */
.setup{width:min(560px,100%);display:grid;gap:20px}
.org-opt{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);cursor:pointer}
.org-opt:hover{background:var(--hover)}
.org-opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.org-opt input{margin:0;width:18px;height:18px}
.org-logo{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:var(--r-md);background:var(--accent-soft);color:var(--accent);font-weight:700;flex:none}
.org-opt:has(input:checked) .org-logo{background:var(--card)}
.org-opt b{display:block}
.org-opt small{color:var(--muted);font-size:var(--fs-sm)}
.org-opt:has(input:checked) small{color:color-mix(in oklch,var(--accent) 45%,var(--ink))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ---------- sources ---------- */
.sources{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.src{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:20px;display:flex;flex-direction:column;gap:14px}
.src.is-on{border-color:var(--good-line)}
.src-top{display:flex;align-items:flex-start;gap:12px}
.src-ic{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:var(--r-md);flex:none}
.src-ic.ff{background:oklch(95% .03 230);color:oklch(45% .12 230)}
.src-ic.qb{background:oklch(95% .035 150);color:oklch(42% .1 150)}
.src-ic.cf{background:oklch(95.5% .03 70);color:oklch(46% .1 60)}
:root[data-theme="dark"] .src-ic.ff{background:oklch(29% .05 230);color:oklch(80% .1 230)}
:root[data-theme="dark"] .src-ic.qb{background:oklch(29% .05 150);color:oklch(80% .1 150)}
:root[data-theme="dark"] .src-ic.cf{background:oklch(30% .05 70);color:oklch(84% .1 75)}
.src h2{font-size:var(--fs-lg)}
.src-top p{font-size:var(--fs-sm);color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:var(--fs-xs);font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.off{background:var(--gap-soft);color:var(--gap)}
.pill.busy{background:var(--accent-soft);color:var(--accent)}
.pill.on{background:var(--good-soft);color:var(--good)}
.pill.busy::before{animation:pulse 900ms ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.25}}
.src-stat{display:flex;gap:18px;font-size:var(--fs-sm);color:var(--ink-2)}
.src-stat b{display:block;font-size:var(--fs-2xl);color:var(--ink);font-weight:600;line-height:1.1}
.src-actions{display:flex;gap:8px;margin-top:auto}
.files{border-top:1px solid var(--line-2);padding-top:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
.src{min-width:0}
.file{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:var(--r-sm);font-size:var(--fs-sm)}
.file:hover{background:var(--hover)}
.file input{margin:0;width:16px;height:16px;flex:none}
.file .fn{flex:1;min-width:0}
.file .fn span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.file .fn small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.file.off .fn span{color:var(--muted);font-weight:400}
.tag{display:inline-block;padding:1px 7px;border-radius:var(--r-sm);font-size:11.5px;font-weight:600;background:var(--gap-soft);color:var(--gap);white-space:nowrap}
.ready{margin-top:20px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:18px 20px}
.checks{display:flex;gap:22px;flex-wrap:wrap;flex:1;list-style:none;margin:0;padding:0}
.checks li{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);color:var(--ink-2)}
.checks li b{color:var(--ink);font-weight:600}
.ok-dot,.no-dot{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;flex:none}
.ok-dot{background:var(--good-soft);color:var(--good)}
.no-dot{background:var(--gap-soft);color:var(--gap)}
.ok-dot svg,.no-dot svg{width:12px;height:12px;stroke-width:2.6}

/* ---------- run analysis ---------- */
.run{width:min(520px,100%);display:grid;gap:22px;text-align:center}
.run ol{list-style:none;margin:0;padding:0;display:grid;gap:4px;text-align:left}
.run li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);color:var(--muted)}
.run li .ic{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.run li.now{color:var(--ink);background:var(--subtle)}
.run li.now .ic{border-color:var(--accent);border-top-color:transparent;animation:spin 800ms linear infinite}
.run li.done{color:var(--ink-2)}
.run li.done .ic{background:var(--good-soft);border-color:var(--good-line);color:var(--good)}
.run li.done .ic svg{width:13px;height:13px;stroke-width:2.6}
.run li small{margin-left:auto;color:var(--muted);font-size:var(--fs-xs);font-variant-numeric:tabular-nums}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:6px;border-radius:999px;background:var(--line-2);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width 380ms var(--ease)}

/* ---------- dashboard ---------- */
.dash-head h1{font-size:var(--fs-3xl)}
.meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:var(--fs-sm);color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden;margin-bottom:20px}
.kpi{background:var(--card);padding:18px 20px}
.kpi .lbl{font-size:var(--fs-sm);color:var(--muted);font-weight:500}
.kpi .val{font-size:var(--fs-4xl);font-weight:600;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .val small{font-size:var(--fs-md);font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.kpi .sub{font-size:var(--fs-xs);color:var(--muted);margin-top:2px}
.kpi.hi .val{color:var(--crit)}
.ucs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.uc{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:24px;display:flex;flex-direction:column;gap:18px}
.uc-top{display:flex;align-items:flex-start;gap:14px}
.uc-letter{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:var(--r-md);background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:var(--fs-xl);flex:none}
.uc-top h2{font-size:var(--fs-xl)}
.uc-top p{font-size:var(--fs-sm);color:var(--muted);margin-top:2px}
.uc-top .sev{margin-left:auto}
.sev{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:var(--fs-xs);font-weight:600;white-space:nowrap}
.sev::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sev.High{background:var(--crit-soft);color:var(--crit)}
.sev.Medium{background:var(--warn-soft);color:var(--warn)}
.sev.Low{background:var(--low-soft);color:var(--low)}
.sev.Pass{background:var(--good-soft);color:var(--good)}
.sev.Pending,.sev.Gap{background:var(--gap-soft);color:var(--gap)}
.hero{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero b{font-size:var(--fs-5xl);font-weight:600;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero span{font-size:var(--fs-lg);color:var(--ink-2);font-weight:500}
.uc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.uc-stats div{padding:12px 14px;border-radius:var(--r-md);background:var(--subtle)}
.uc-stats dt{font-size:var(--fs-xs);color:var(--muted);font-weight:500}
.uc-stats dd{margin:2px 0 0;font-size:var(--fs-xl);font-weight:600;font-variant-numeric:tabular-nums}
.uc-stats dd small{font-size:var(--fs-xs);font-weight:500;color:var(--muted)}
.uc-stats dd small.blk{display:block;margin-top:2px}
.uc-line{font-size:var(--fs-md);color:var(--ink-2);padding-top:14px;border-top:1px solid var(--line-2)}
.uc-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;flex-wrap:wrap}
.uc-foot .muted{font-size:var(--fs-xs)}
/* split bar */
.split{display:grid;gap:8px}
.split .bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--bar-muted);gap:2px}
.split .bar i{display:block;height:100%}
.split .bar i.bad{background:var(--bar-bad)}
.split .bar i.ok{background:var(--bar-ok)}
.split .bar i.none{background:var(--bar-muted)}
.split .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--ink-2)}
.split .legend span{display:inline-flex;align-items:center;gap:6px}
.split .legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.split .legend i.bad{background:var(--bar-bad)}.split .legend i.ok{background:var(--bar-ok)}.split .legend i.none{background:var(--bar-muted)}
.split .cap{font-size:var(--fs-sm);font-weight:600;color:var(--ink-2)}
.meters{display:grid;gap:10px}
.meter{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:var(--fs-sm)}
.meter .track{grid-column:1/-1;height:8px;border-radius:999px;background:var(--bar-muted);overflow:hidden}
.meter .track i{display:block;height:100%;border-radius:inherit;background:var(--bar-ok);min-width:3px}
.meter .track i.bad{background:var(--bar-bad)}
.meter b{font-variant-numeric:tabular-nums;font-weight:600}
.meter span{color:var(--ink-2)}

/* findings list on dashboard */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:36px 0 14px}
.sec-h h2{font-size:var(--fs-xl)}
.sec-h a{font-size:var(--fs-sm);font-weight:600;color:var(--accent);text-decoration:none}
.ins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.insight{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:grid;gap:10px;align-content:start}
.insight-h{display:flex;align-items:center;gap:10px}
.insight-h h3{font-size:var(--fs-lg);flex:1}
.insight .what{color:var(--ink)}
.insight .why{font-size:var(--fs-sm);color:var(--ink-2)}
.insight .why .cite,.cite{font-family:var(--font-mono);font-size:12px;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:var(--r-sm);white-space:nowrap}
.insight .foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line-2);font-size:var(--fs-sm)}
.insight .foot b{font-variant-numeric:tabular-nums}
.insight .next{display:flex;gap:8px;font-size:var(--fs-sm);color:var(--ink-2)}
.insight .next svg{color:var(--accent);margin-top:2px}
.insight>div:last-child .btn-ghost{margin-left:-14px}
.rules-line{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);color:var(--muted)}
.rules-line svg{color:var(--accent)}
.fl-list{display:grid;gap:6px}
.fl-list>span{display:block}
.why-list{display:grid;gap:14px}
.why-list h4{margin:0 0 4px;font-size:var(--fs-sm)}
.uc-tag{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:var(--r-sm);padding:1px 7px}
.data-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden}
.data-strip>div{background:var(--card);padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
.data-strip b{display:block;font-size:var(--fs-sm)}
.data-strip small{display:block;font-size:var(--fs-xs);color:var(--muted)}
.gaps{margin-top:10px;font-size:var(--fs-xs);color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap}
.gaps span{display:inline-flex;align-items:center;gap:6px}

/* ---------- detail ---------- */
.d-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden;margin-bottom:24px}
.d-stats>div{background:var(--card);padding:16px 18px}
.d-stats dt{font-size:var(--fs-sm);color:var(--muted)}
.d-stats dd{margin:4px 0 0;font-size:var(--fs-2xl);font-weight:600;font-variant-numeric:tabular-nums}
.d-stats dd small{font-size:var(--fs-sm);color:var(--muted);font-weight:500}
.fl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:grid;gap:8px;text-align:left;align-content:start;width:100%}
button.fcard:hover{background:var(--hover)}
.fcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.fcard .insight-h h3{font-size:var(--fs-md)}
.uc-line,.fcard .insight-h h3{font-weight:inherit}
.fcard .insight-h h3{font-weight:600}
.fcard .what{font-size:var(--fs-sm);color:var(--ink)}
.fcard .why{font-size:var(--fs-sm);color:var(--ink-2)}
.fcard .next{display:flex;gap:8px;font-size:var(--fs-sm);color:var(--ink-2)}
.fcard .next svg{color:var(--accent);margin-top:2px}
.fcard .cnt{font-size:var(--fs-sm);color:var(--ink-2)}
.fcard .cnt b{color:var(--ink)}
.tbl-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 0 12px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:var(--r-md);background:var(--subtle);border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-size:var(--fs-sm);font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.seg button span{color:var(--muted);font-weight:500;margin-left:4px}
.tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
th{text-align:left;font-size:var(--fs-xs);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:11px 12px;background:var(--thead);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--hover)}
tbody tr.row[aria-expanded="true"] td{background:var(--subtle);border-bottom-color:transparent}
td.r,th.r{text-align:right}
tbody tr.row td:nth-last-child(2){min-width:180px}
tbody tr.row td:first-child{min-width:130px}
td .em{font-weight:600;color:var(--ink)}
td .sub{display:block;font-size:var(--fs-xs);color:var(--muted)}
td .diff-bad{color:var(--crit);font-weight:600}
td .diff-ok{color:var(--good);font-weight:600}
td .chev{color:var(--muted);transition:transform 160ms var(--ease)}
tr[aria-expanded="true"] .chev{transform:rotate(90deg)}
tr.ev td{background:var(--subtle);padding:0 14px 16px}
.evp{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.evp{padding-top:6px}
.evp h3{margin:0 0 8px;font-size:var(--fs-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.evp ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.evp li{display:grid;gap:2px}
.evp li b{font-size:var(--fs-sm)}
.evp li span{font-size:var(--fs-xs);color:var(--muted)}
.evp .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:var(--fs-sm)}
.evp .kv dt{color:var(--muted)}
.evp .kv dd{margin:0}
.empty{padding:36px;text-align:center;color:var(--muted)}
.note{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:var(--r-md);background:var(--gap-soft);color:var(--ink-2);font-size:var(--fs-sm)}
.note svg{color:var(--gap);margin-top:1px}
.foot-legal{margin-top:40px;font-size:var(--fs-xs);color:var(--muted);text-align:center}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.view{animation:rise 260ms var(--ease)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- responsive ---------- */
@media (max-width:1020px){
  .sources{grid-template-columns:1fr}
  .ucs,.ins,.fl{grid-template-columns:1fr}
  .top-in .status{display:none}
}
@media (max-width:760px){
  .top-in{padding:0 16px;gap:10px;flex-wrap:wrap;padding-block:8px}
  .nav{order:5;width:100%;overflow-x:auto}
  .org-chip{padding:4px}
  .org-chip span{display:none}
  main{padding:24px 16px 48px}
  .kpis,.d-stats{grid-template-columns:1fr 1fr}
  .uc-stats{grid-template-columns:1fr 1fr}
  .data-strip{grid-template-columns:1fr}
  .evp{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .steps .lbl{display:none}
  .hero b{font-size:var(--fs-4xl)}
}

/* ---------- onboarding v2: sign up, organization profile, connections, agents ---------- */
.field{align-content:start}
::placeholder{color:var(--muted);opacity:1}
.conn-sum dd.mono,.agent-kv dd.mono{font-size:13px}
.agent-h>div:nth-child(2){flex:1 1 220px;min-width:0}
.field label.check{font-weight:400;color:var(--ink)}
.still .view{animation:none}
.auth.wide{width:min(720px,100%)}
.auth-steps{display:flex;justify-content:center;overflow-x:auto}
.narrow{max-width:900px;margin:0 auto}
.card-form{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl)}
.form-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:22px 24px;border-bottom:1px solid var(--line-2)}
.form-head h1{font-size:var(--fs-2xl)}
.form-head h2{font-size:var(--fs-xl)}
.form-head p{color:var(--ink-2);margin-top:4px;font-size:var(--fs-sm)}
.form-sec{padding:20px 24px}
.form-sec+.form-sec{border-top:1px solid var(--line-2)}
.form-sec>h2{font-size:var(--fs-md);margin-bottom:14px}
.form-sec .rules-line{margin-top:14px}
.form-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 24px;border-top:1px solid var(--line-2);font-size:var(--fs-sm)}
.form-foot a,.panel a{color:var(--accent);font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px}
.fgrid .span{grid-column:1/-1}
.field .lab{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px;font-size:var(--fs-sm);font-weight:600;color:var(--ink-2)}
.field .lab label{font-size:inherit;font-weight:inherit;color:inherit}
.req{color:var(--crit)}
fieldset.field{border:0;margin:0;padding:0;min-width:0}
legend.lab{padding:0;margin-bottom:6px}
.hint{font-size:var(--fs-xs);color:var(--muted)}
.err{font-size:var(--fs-xs);color:var(--crit);font-weight:500}
.field.bad .input{border-color:var(--crit)}
.legend-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--line-2);font-size:var(--fs-xs);color:var(--muted)}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:var(--r-sm);font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.c-signup{background:var(--accent-soft);color:var(--accent)}
.chip.c-record{background:var(--good-soft);color:var(--good)}
.chip.c-reference{background:var(--low-soft);color:var(--low)}
.chip.c-entered{background:var(--warn-soft);color:var(--warn)}
.chip.c-missing{color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.input.sm{min-height:34px;padding:5px 10px;font-size:var(--fs-sm)}
select.input{appearance:auto}
/* connections */
.sources.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.src form{display:grid;gap:14px}
.checks-v{display:grid;gap:6px}
.check{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:var(--r-md);background:var(--subtle);cursor:pointer;font-size:var(--fs-sm)}
.check input{margin:2px 0 0;width:16px;height:16px;flex:none}
.check b{display:block;font-weight:600}
.check small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.conn-sum{display:grid;gap:6px;margin:0;font-size:var(--fs-sm)}
.conn-sum div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px}
.conn-sum dt{color:var(--muted)}
.conn-sum dd{margin:0;overflow-wrap:anywhere}
.src.case{margin-top:16px}
.src.case .src-actions{margin-top:0}
/* agents */
.sim-note{display:flex;gap:10px;align-items:flex-start;margin:0 0 18px;padding:11px 14px;border-radius:var(--r-md);border:1px dashed var(--input-line);font-size:var(--fs-sm);color:var(--ink-2)}
.sim-note svg{color:var(--muted);margin-top:2px}
.agents{display:grid;gap:20px}
.agent{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden}
.agent-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 22px;border-bottom:1px solid var(--line-2)}
.agent-h h2{font-size:var(--fs-lg)}
.agent-h p{font-size:var(--fs-sm);color:var(--muted)}
.agent-h .hgap{display:none}
.tag.sim{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--input-line)}
.agent-b{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;padding:20px 22px}
.agent-kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 18px;align-items:center;margin:0;font-size:var(--fs-sm)}
.agent-kv dt{color:var(--muted)}
.agent-kv dd{margin:0;overflow-wrap:anywhere}
.agent-kv .input{max-width:260px}
.agent-chk{background:var(--subtle);border-radius:var(--r-lg);padding:16px}
.chk-h{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:var(--fs-sm)}
.chk-h span{color:var(--muted)}
.agent-chk ol{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:10px}
.agent-chk li{display:flex;gap:10px;align-items:flex-start;color:var(--muted)}
.agent-chk li .ic{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none;background:var(--card)}
.agent-chk li.done{color:var(--ink-2)}
.agent-chk li.done .ic{background:var(--good-soft);border-color:var(--good-line);color:var(--good)}
.agent-chk li.done .ic svg{width:12px;height:12px;stroke-width:2.6}
.agent-chk li.now{color:var(--ink)}
.agent-chk li.now .ic{border-color:var(--accent);border-top-color:transparent;animation:spin 800ms linear infinite}
.agent-chk li b{display:block;font-size:var(--fs-sm);font-weight:600}
.agent-chk li small{display:block;font-size:var(--fs-xs);color:var(--muted);overflow-wrap:anywhere}
@media (max-width:1020px){.sources.two,.agent-b{grid-template-columns:1fr}}
@media (max-width:760px){.top-in>.steps{order:5;width:100%;justify-content:center;padding-bottom:4px}.agent-kv{grid-template-columns:1fr;gap:2px}.agent-kv dt{margin-top:8px;font-size:var(--fs-xs)}.fgrid{grid-template-columns:1fr}.form-head,.form-sec,.form-foot,.legend-row{padding-left:16px;padding-right:16px}.conn-sum div{grid-template-columns:1fr;gap:0}.agent-h,.agent-b{padding:16px}}

/* ---------- v4: agent portfolio, readiness, coverage, exposure ---------- */
.steps li+li::before{width:16px}
@media (max-width:1280px){.top-in>.steps li:not(.on) .lbl{display:none}}
.src-ic.pn{background:oklch(95% .03 300);color:oklch(45% .13 300)}
.src-ic.ex{background:oklch(95.5% .03 40);color:oklch(48% .11 40)}
.src-ic.adp{background:oklch(95% .02 258);color:oklch(45% .08 258)}
:root[data-theme="dark"] .src-ic.pn{background:oklch(30% .05 300);color:oklch(82% .1 300)}
:root[data-theme="dark"] .src-ic.ex{background:oklch(30% .05 40);color:oklch(84% .1 45)}
:root[data-theme="dark"] .src-ic.adp{background:oklch(29% .03 258);color:oklch(82% .06 258)}
.icon-btn.sm{width:28px;height:28px}
.copyline{display:inline-flex;align-items:center;gap:2px;max-width:100%;min-width:0;vertical-align:middle}
.copyline .mono{font-size:13px;overflow-wrap:anywhere;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:var(--r-md);font-size:var(--fs-sm);box-shadow:var(--pop);z-index:50;max-width:calc(100% - 32px)}
.ag-sum{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--ink-2)}
.ag-sum>span{display:inline-flex;gap:6px;align-items:center;font-weight:600}
.ag-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px;align-items:start}
.palette{display:grid;gap:18px}
.pal-g{display:grid;gap:10px}
.pal-h{font-size:var(--fs-sm);font-weight:600;color:var(--muted)}
.agc{display:grid;gap:8px;text-align:left;width:100%;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);color:var(--ink);transition:background-color 120ms var(--ease),border-color 120ms var(--ease)}
.agc:hover{background:var(--hover)}
.agc.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.agc.future{background:var(--subtle)}
.agc-top{display:flex;align-items:center;gap:12px}
.agc-top .src-ic{width:36px;height:36px}
.agc-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.agc-t b{font-size:var(--fs-md)}
.agc-p{font-size:var(--fs-sm);color:var(--ink-2)}
.agc-f{display:flex;align-items:center;gap:10px;font-size:var(--fs-xs);color:var(--muted);min-width:0}
.agc-last{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.av{display:inline-flex;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.av-live{background:var(--good-soft);color:var(--good)}
.av-new{background:var(--accent-soft);color:var(--accent)}
.av-soon{color:var(--muted);box-shadow:inset 0 0 0 1px var(--input-line)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:600;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st-not{color:var(--gap)}
.st-test{color:var(--accent)}
.st-test::before{animation:pulse 900ms ease-in-out infinite alternate}
.st-act{color:var(--good)}
.st-soon{color:var(--muted)}
.st-soon::before{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
/* configuration panel */
.cfg{position:sticky;top:76px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden}
.cfg-head{display:flex;align-items:flex-start;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.cfg-t{flex:1 1 220px;min-width:0}
.cfg-t h2{font-size:var(--fs-xl)}
.cfg-t p{font-size:var(--fs-sm);color:var(--ink-2);margin-top:2px}
.cfg-badges{display:flex;gap:10px;align-items:center}
.complete{padding:14px 20px;border-bottom:1px solid var(--line-2);display:grid;gap:8px}
.complete-h{display:flex;justify-content:space-between;font-size:var(--fs-sm)}
.complete-h span{color:var(--muted)}
.complete .track{height:6px;border-radius:999px;background:var(--bar-muted);overflow:hidden}
.complete .track i{display:block;height:100%;background:var(--bar-ok);border-radius:inherit;transition:width 200ms var(--ease)}
.complete-l{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:var(--fs-xs);color:var(--muted)}
.complete-l li{display:inline-flex;align-items:center;gap:4px}
.complete-l li.ok{color:var(--good)}

/* readiness */

.rd-col ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}

.blockers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.gapc{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:grid;gap:8px;align-content:start}

.gapc h3{font-size:var(--fs-lg)}
.gapc-dl{display:grid;grid-template-columns:64px minmax(0,1fr);gap:6px 10px;margin:0;font-size:var(--fs-sm)}
.gapc-dl dt{color:var(--muted)}
.gapc-dl dd{margin:0;color:var(--ink-2)}
/* complaint coverage */
.cov{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:16px 18px;display:grid;gap:14px}
.cov-top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.cov-bar{display:flex;gap:3px;flex:1 1 260px;height:10px}

.cov-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--ink-2)}

i.cv-ok{background:var(--bar-ok)}

.cv-none .cv-st{color:var(--muted)}
.cv-m{font-size:var(--fs-xs);font-weight:600}
.cv-req,.cv-d{font-size:12px;color:var(--ink-2);line-height:1.3}
/* dashboard */
.demo-tag{display:inline-flex;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);vertical-align:1px}

/* ---------- v5: agent ecosystem, journey bar, tooltips, plain-English insights ---------- */

.journey{border-top:1px solid var(--line-2);background:var(--card)}

.steps .open{color:var(--ink-2)}

.steps .done{color:var(--ink-2)}

.tip-i{display:inline-grid;place-items:center;width:24px;height:24px;margin:-4px -2px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--muted);vertical-align:middle;flex:none}

.test-steps.in{padding:4px 0;border:0}

  .rd-files{grid-template-columns:1fr}
  .td{grid-template-columns:1fr;padding:16px}
  .td-n{display:none}
  .td-side{grid-column:1}
  .terms dl{grid-template-columns:1fr}
  .lede{font-size:var(--fs-md)}
  .cfg-meta{padding-left:16px;padding-right:16px}
  .auth-steps .steps .lbl{display:none}
  .auth-steps .steps .on .lbl,.journey .steps .on .lbl{display:inline}
}

/* ---------- impeccable pass: detector, craft floor and audit fixes ---------- */
.btn{line-height:1.3}
/* citations read as plain words, in the body face, on a soft tint */
.cite,.insight .why .cite{font-family:var(--font-sans);font-size:12.5px;font-weight:500;padding:2px 7px}
/* update kind and date sit under the title, not above it */
.upd-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted)}
.upd-meta .tag{background:oklch(95.5% .035 182);color:oklch(40% .08 182)}
:root[data-theme="dark"] .upd-meta .tag{background:oklch(29% .05 182);color:oklch(84% .08 182)}
/* tables sit inset in their card */
.tbl-wrap{padding:6px}
.tbl-wrap th{border-bottom:0}
.tbl-wrap th:first-child{border-radius:var(--r-md) 0 0 var(--r-md)}
.tbl-wrap th:last-child{border-radius:0 var(--r-md) var(--r-md) 0}
.tbl-wrap tbody tr:last-child td{border-bottom:0}
tr.ev td{padding:4px 12px 14px}
.auth-main{max-width:none;margin:0;padding:32px 16px}
.back{min-height:32px}
.gaps-alert a{display:inline-flex;align-items:center;min-height:28px}
@media (prefers-reduced-motion:reduce){.run li.now .ic,.test-steps li.now .ic{border-top-color:var(--accent);background:var(--accent-soft)}}

/* ---------- impeccable pass 2: critique fixes ---------- */
/* journey: never clip the first step; phones get a plain Step n of 7 line */
.journey-in,.auth-steps{justify-content:safe center}
.journey-sm{display:none}
.st-ready{color:var(--accent)}
.st-ready::before{background:transparent;box-shadow:inset 0 0 0 2px currentColor}
/* a locked call to action says why, in words */
.btn.is-off{opacity:1;background:var(--subtle);color:var(--muted);border-color:var(--line);cursor:not-allowed}
.cta-lock{display:inline-grid;justify-items:end;gap:4px}
.cta-lock small{font-size:var(--fs-xs);color:var(--ink-2)}
.cite[tabindex]:focus-visible,.impact[tabindex]:focus-visible,.fname:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.cite[tabindex]{cursor:help}
details.tech{padding:10px 20px 14px;border-bottom:1px solid var(--line-2);font-size:var(--fs-sm)}
details.tech summary{cursor:pointer;color:var(--ink-2);font-weight:600;font-size:var(--fs-xs)}
details.tech .kv{margin-top:8px}
.count-list{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 14px}
.count-list li{display:flex;gap:8px;align-items:baseline;font-size:var(--fs-sm)}
.count-list b{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:5px;background:var(--card);font-size:11px;font-variant-numeric:tabular-nums}
.ok-note{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 18px;padding:12px 14px;border-radius:var(--r-md);background:var(--good-soft);color:var(--ink);font-size:var(--fs-sm)}
.ok-note>svg{color:var(--good);flex:none}
.ok-note>span{flex:1 1 280px}
.rd-col li .fname{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* insights */
.head-acts{display:flex;gap:10px;flex-wrap:wrap}
.onpage{display:flex;gap:6px 18px;flex-wrap:wrap;margin:-8px 0 18px;font-size:var(--fs-sm)}
.onpage a{color:var(--accent);font-weight:600;text-decoration:none;min-height:28px;display:inline-flex;align-items:center}
.onpage a:hover{text-decoration:underline}
.gaps-alert{margin:0 0 4px}
.meter .track i.warn{background:oklch(78% .13 80)}
.td-side .demo-tag{margin:0 0 4px}
.td-rv{font-size:var(--fs-xs);color:var(--muted);margin:-8px 0 10px}
[id="todo"],[id="areas"],[id="coverage"],[id="watch"],[id="terms"]{scroll-margin-top:130px}
/* review decisions */
.disp{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.disp svg{width:12px;height:12px}
.d-confirmed{background:var(--crit-soft);color:var(--crit)}
.d-clear{background:var(--good-soft);color:var(--good)}
.d-follow{background:var(--warn-soft);color:var(--warn)}
.disp-box{display:flex;align-items:flex-end;gap:12px 18px;flex-wrap:wrap;margin-top:6px;padding:14px 0 2px}
.disp-box h3{flex-basis:100%;margin:0;font-size:var(--fs-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.disp-opts{display:flex;gap:6px;flex-wrap:wrap}
.note-f{display:grid;gap:4px;flex:1 1 260px;font-size:var(--fs-xs);font-weight:600;color:var(--ink-2)}
.rv-bar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;margin:-4px 0 12px}
.rv-prog{display:inline-flex;align-items:center;gap:10px;font-size:var(--fs-sm);color:var(--ink-2);margin-right:auto}
.rv-prog b{color:var(--ink);font-variant-numeric:tabular-nums}
.rv-track{display:inline-block;width:120px;height:6px;border-radius:999px;background:var(--bar-muted);overflow:hidden}
.rv-track i{display:block;height:100%;background:var(--bar-ok);border-radius:inherit}
.menu button.danger{color:var(--crit);font-weight:600}
@media (max-width:760px){
  .journey-sm{display:flex;align-items:center;gap:12px;padding:8px 16px 0;font-size:var(--fs-sm);color:var(--ink-2)}
  .journey-sm b{color:var(--ink)}
  .jbar{flex:1;height:4px;border-radius:999px;background:var(--bar-muted);overflow:hidden}
  .jbar i{display:block;height:100%;background:var(--accent)}
  .cta-lock{justify-items:start}
  .head-acts{width:100%}
}

/* ---------- impeccable pass 3: rendered-layout scan (no nested cards, readable measure) ---------- */
dd,li,.what,.why,.next,.lede,.hint,small{text-wrap:pretty}
/* PAGA updates: a divided list inside the panel, not cards in a card */
.upds{gap:0}
.upd:first-child{border-top:0;padding-top:4px}
/* evidence and decisions sit on the expanded row's own tint, separated by space, not boxes */
.evp{gap:28px;padding-top:4px}
.evp section{padding:4px 0}
/* prose measure: about 70 to 78 characters a line (this face runs narrower than its 0, so ch values sit lower) */
.lede{max-width:58ch;font-size:16px}
.td .what,.td .why,.td .next{max-width:60ch}
.upd p,.upd li,.watch>p,.watch h3{max-width:60ch}
.terms dd,.ok-note>span,.gaps-alert>span{max-width:66ch}
.uc-top p,.meter small{max-width:60ch}
.terms dd{max-width:58ch}
.foot-legal{max-width:68ch;margin-left:auto;margin-right:auto}

const Engine = (() => {
  'use strict';

  const SUFFIX = new Set(['sr', 'jr', 'ii', 'iii', 'iv', 'app']);

  const sum = (a, f = x => x) => a.reduce((s, x) => s + f(x), 0);
  const mins = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const secs = t => { const [h, m, s = 0] = t.split(':').map(Number); return h * 3600 + m * 60 + s; };
  const t12 = t => { const [h, m] = t.split(':').map(Number); return `${(h % 12) || 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
  const md = d => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;
  const t12s = t => { const [h, m, x = 0] = t.split(':').map(Number); return `${(h % 12) || 12}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };

  /* ---------- names, jobs, periods ---------- */
  const tokens = n => n.toLowerCase().replace(/[.,*]/g, ' ').split(/\s+/).filter(t => t.length > 1 && !SUFFIX.has(t));
  const displayName = qb => {
    const clean = qb.replace(/\*/g, ' ').replace(/\.(?=\s*,)/g, '').replace(/\s+/g, ' ').trim();
    const i = clean.indexOf(',');
    return i < 0 ? clean : `${clean.slice(i + 1).trim()} ${clean.slice(0, i).trim()}`;
  };
  function matchName(ffName, qbNames) {
    const ft = tokens(ffName);
    let best = null, score = 0, tie = false;
    for (const q of qbNames) {
      const qt = new Set(tokens(q));
      const s = ft.filter(t => qt.has(t)).length;
      if (s > score) { best = q; score = s; tie = false; } else if (s === score && s > 0) tie = true;
    }
    return score >= 2 && !tie ? best : null;
  }
  const titleCase = s => s.toLowerCase().replace(/\b([a-z])/g, c => c.toUpperCase()).replace(/\bInc\b/g, 'Inc');
  function parseJob(j) {

    const m = label.match(/(\w+) (\d+) - (\d+), (\d{4})/);
    const mo = String(MONTHS.indexOf(m[1].toLowerCase()) + 1).padStart(2, '0');
    return {start: `${m[4]}-${mo}-${m[2].padStart(2, '0')}`, end: `${m[4]}-${mo}-${m[3].padStart(2, '0')}`, label};

  const restRequired = m => m < 210 ? 0 : m <= 360 ? 1 : m <= 600 ? 2 : 3;

     Prevailing-wage payroll items get one sample rate each. Every other hour uses the

     so the same person always gets the same rate. Overtime lines pay 1.5 x base. */

  function demoRates(lines) {
    const byEmp = new Map();
    for (const l of lines) { if (!byEmp.has(l.emp)) byEmp.set(l.emp, []); byEmp.get(l.emp).push(l); }
    const base = new Map();
    for (const [e, ls] of byEmp) {
      const craft = ls.some(l => /Asbestos/.test(l.item || '')) ? 'Asbestos' : ls.some(l => /Demo Labor/.test(l.item || '')) ? 'Demolition'
        : ls.some(l => /SHOP/i.test(l.payItem)) ? 'Shop' : ls.some(l => /Office/i.test(l.payItem)) ? 'Office' : 'Demolition';
      const [lo, hi] = BANDS[craft], steps = Math.round((hi - lo) * 2);
      base.set(e, {rate: lo + (steps ? hash(e) % (steps + 1) : 0) / 2, craft});
    }
    const lineRate = l => DEMO_ITEM_RATE[l.payItem] ?? (OT_ITEM.test(l.payItem) ? r2(base.get(l.emp).rate * 1.5) : base.get(l.emp).rate);
    const dayRate = ls => { const w = ls.filter(l => !NONWORK.test(l.payItem) && !OT_ITEM.test(l.payItem)); const h = sum(w, l => l.hours); return h ? r2(sum(w, l => l.hours * lineRate(l)) / h) : null; };
    return {base, lineRate, dayRate};
  }

  /* ---------- analysis ---------- */
  function analyse(D, sel) {
    const has = (src, name) => sel[src] && sel[src].includes(name);
    const useQB = has('quickbooks', 'time by name detail.xlsx');
    const timesheets = D.ff.timesheets.filter(t => has('fieldflow', t.file));
    const activity = D.ff.activity.filter(a => has('fieldflow', a.file));
    const complaintFile = D.sources.cases.files.find(f => f.kind === 'Complaint');
    const complaint = complaintFile && has('cases', complaintFile.name) ? D.complaint : null;
    const lines = useQB ? D.qb.lines : [];
    const period = parsePeriod(D.qb.meta.period);
    const qbNames = [...new Set(lines.map(l => l.emp))];
    const name = e => e && e.startsWith('ff:') ? e.slice(3) : displayName(e);

    // pay lines by employee-day
    const days = new Map();
    for (const l of lines) {
      const k = `${l.emp}|${l.date}`;
      if (!days.has(k)) days.set(k, {emp: l.emp, date: l.date, lines: [], worked: 0, ot: 0});
      const d = days.get(k);
      d.lines.push(l);
      if (!NONWORK.test(l.payItem)) d.worked += l.hours;
      if (OT_ITEM.test(l.payItem)) d.ot += l.hours;
    }
    const mainJob = ls => {
      const by = {};
      for (const l of ls) by[l.job] = (by[l.job] || 0) + l.hours;
      return Object.entries(by).sort((a, b) => b[1] - a[1])[0][0];
    };

    // FieldFlo shifts, matched to payroll employees
    const shifts = timesheets.flatMap(t => t.shifts.map((s, i) => {
      const emp = matchName(s.name, qbNames);
      return {...s, i, ts: t, date: t.date, job: t.job, jobNo: ffJobNo(t.job), emp: emp || `ff:${s.name}`, matched: !!emp,
        inPeriod: useQB && t.date >= period.start && t.date <= period.end};
    }));
    const shiftFor = (emp, date) => shifts.filter(s => s.emp === emp && s.date === date);

    const findings = [];
    const add = f => { f.people = new Set(f.rows.map(r => r.emp).filter(Boolean)); findings.push(f); return f; };
    const why = (claim, rule) => ({claim: complaint && claim ? CLAIM[claim] : null, rule: rule ? {id: rule, ...D.rules[rule], why: RULE_WHY[rule]} : null});
    const qbRef = l => ({src: 'QuickBooks', file: 'time by name detail.xlsx', ref: `row ${l.row}`, text: `${l.payItem} · ${r2(l.hours)} h`, sub: [l.item, l.notes].filter(Boolean).join(' · ')});
    const ffRef = (s, named) => ({src: 'FieldFlo', file: s.ts.file, ref: s.ts.job,
      text: `${named ? `${s.name}: ` : ''}${t12(s.start)}–${t12(s.end)} · ${s.workMin / 60} h worked`,
      sub: [s.meal ? `meal ${t12(s.meal[0])}–${t12(s.meal[1])}` : 'no meal entry', `verified ${t12s(s.verifiedAt)}`].join(' · ')});

    /* ===== A · Hours & Pay Reconciliation ===== */
    const recon = [], pending = [], unmatched = [];
    for (const s of shifts) {
      const rec = s.workMin / 60;
      if (!useQB) continue;
      if (!s.inPeriod) { pending.push({id: `p-${s.date}-${s.i}`, kind: 'pending', emp: s.emp, date: s.date, job: s.ts.project, jobNo: s.jobNo, recorded: rec, shift: s, evidence: [ffRef(s)]}); continue; }
      if (!s.matched) { unmatched.push(s); continue; }
      const d = days.get(`${s.emp}|${s.date}`);
      const jl = d ? d.lines.filter(l => parseJob(l.job).no === s.jobNo) : [];
      const paid = sum(jl, l => l.hours);
      recon.push({id: `m-${s.date}-${s.i}`, emp: s.emp, date: s.date, job: s.ts.project, jobNo: s.jobNo, recorded: rec, paid, diff: r2(paid - rec), lines: jl, shift: s,
        evidence: [ffRef(s), ...jl.map(qbRef)]});
    }
    const matchedRows = recon.filter(r => Math.abs(r.diff) < 0.01 && r.lines.length);
    const diffRows = recon.filter(r => !(Math.abs(r.diff) < 0.01 && r.lines.length));
    if (diffRows.length) add({id: 'A0', short: 'pay gaps', uc: 'A', sev: diffRows.some(r => r.diff < 0) ? 'High' : 'Medium', title: 'Recorded and paid hours differ',
      what: `${diffRows.length} FieldFlo shift${diffRows.length > 1 ? 's' : ''} differ from QuickBooks by ${r2(sum(diffRows, r => Math.abs(r.diff)))} h in total.`,
      ...why('unpaid', 'CA-LAW-0024'), next: 'Trace each difference to an edit or a missed pay line.',
      rows: diffRows.map(r => ({...r, fid: 'A0', label: r.lines.length ? (r.diff < 0 ? 'Paid less than recorded' : 'Paid more than recorded') : 'Recorded, not paid'}))});
    if (unmatched.length) add({id: 'A4', short: 'name gaps', uc: 'A', sev: 'Low', title: 'Timecard name not found in payroll',
      what: `${unmatched.length} FieldFlo name${unmatched.length > 1 ? 's' : ''} could not be matched to a QuickBooks employee.`, ...why(null, 'CA-LAW-0047'),
      next: 'Map these names to payroll IDs.', rows: unmatched.map(s => ({id: `u-${s.date}-${s.i}`, fid: 'A4', emp: s.emp, date: s.date, job: s.ts.project, jobNo: s.jobNo, recorded: s.workMin / 60, evidence: [ffRef(s)], label: 'No payroll match'}))});

    // daily / weekly overtime
    const otRows = [];
    let otOk = 0;
    const byEmp = new Map();
    for (const d of days.values()) { if (!byEmp.has(d.emp)) byEmp.set(d.emp, []); byEmp.get(d.emp).push(d); }
    for (const [emp, ds] of byEmp) {
      ds.sort((a, b) => a.date.localeCompare(b.date));
      let req = 0, paid = 0, regCap = 0;
      const per = ds.map(d => { const dr = Math.max(0, Math.min(d.worked, 12) - 8) + Math.max(0, d.worked - 12); req += dr; paid += d.ot; regCap += Math.min(d.worked, 8); return {d, dr}; });
      const weekly = Math.max(0, regCap - 40);
      req += weekly;
      let short = r2(req - paid);
      if (short > 0.009) {
        for (const {d, dr} of per) {
          const s = r2(Math.min(dr - d.ot, short));
          if (s <= 0.009) continue;
          short = r2(short - s);
          const job = mainJob(d.lines);
          const fs = shiftFor(emp, d.date)[0];
          otRows.push({id: `o-${emp}-${d.date}`, fid: 'A1', emp, date: d.date, job: parseJob(job).site, jobNo: parseJob(job).no, recorded: fs ? fs.workMin / 60 : null,
            paid: d.worked, otShort: s, lines: d.lines, label: `${r2(d.worked)} h paid at straight time`, evidence: [...(fs ? [ffRef(fs)] : []), ...d.lines.map(qbRef)]});
        }
      } else otOk += per.filter(p => p.d.worked > 8).length;
    }
    if (otRows.length) {
      const jobs = {};
      for (const r of otRows) jobs[r.jobNo || r.job] = (jobs[r.jobNo || r.job] || 0) + 1;
      const top = Object.entries(jobs).sort((a, b) => b[1] - a[1])[0];
      const topRow = otRows.find(r => (r.jobNo || r.job) === top[0]);
      const fed = otRows.some(r => r.lines.some(l => /^federal/i.test(l.payItem)));
      const hrs = r2(sum(otRows, r => r.otShort));
      add({id: 'A1', short: 'overtime', uc: 'A', sev: 'High', title: 'Overtime not paid on long shifts',
        what: `${otRows.length} shifts over 8 hours were paid entirely at straight time${top[1] === otRows.length ? `, all on ${topRow.job} (${top[0]})` : ''}.`,
        ...why('ot', 'CA-LAW-0018'),
        next: fed ? 'Ask counsel whether this job is exempt from daily overtime, for example as work on a federal enclave or under an alternative workweek. If not, pay the overtime.' : 'Check for an alternative workweek election. If there is none, pay the overtime.',
        contrast: otOk ? `Other jobs paid overtime after 8 hours on ${otOk} of ${otOk} long days.` : null,
        rows: otRows, hours: hrs});
    }

    // verified before recorded end
    const early = shifts.filter(s => secs(s.verifiedAt) < secs(s.end));
    if (early.length) {
      const gap = s => Math.round((secs(s.end) - secs(s.verifiedAt)) / 60);
      const max = Math.max(...early.map(gap));
      add({id: 'A2', short: 'verified early', uc: 'A', sev: 'Medium', title: 'Hours verified before the shift ended',
        what: `${early.length} of ${shifts.length} shifts were verified before their recorded end time, up to ${max} min early.`,
        ...why('timesheet', 'CA-LAW-0024'), next: 'Confirm actual end of work against gate, GPS or supervisor records.',
        rows: early.map(s => ({id: `e-${s.date}-${s.i}`, fid: 'A2', emp: s.emp, date: s.date, job: s.ts.project, jobNo: s.jobNo, recorded: s.workMin / 60,
          paid: s.inPeriod ? sum((days.get(`${s.emp}|${s.date}`) || {lines: []}).lines.filter(l => parseJob(l.job).no === s.jobNo), l => l.hours) : null,
          early: gap(s), label: `Verified ${gap(s)} min before end`, shift: s, evidence: [ffRef(s)]}))});
    }

    // job code consistency
    const jc = [];
    for (const l of lines) {
      if (/S2-Job Prep/i.test(l.item || '') && !DRIVE_ITEM.test(l.payItem)) {
        const j = parseJob(l.job);
        jc.push({id: `j-${l.row}`, fid: 'A3', emp: l.emp, date: l.date, job: j.site, jobNo: j.no, paid: l.hours, lines: [l],
          label: `Coded ${l.item.split(':').pop()}, paid as ${l.payItem}`, evidence: [qbRef(l)]});
      }
    }
    for (const t of timesheets) {
      const no = ffJobNo(t.job);
      const ql = lines.find(l => parseJob(l.job).no === no);
      if (!ql) continue;
      const qn = addrNums(parseJob(ql.job).site), fn = addrNums(t.project);
      const miss = fn.filter(n => !qn.includes(n));
      if (miss.length) jc.push({id: `jn-${no}`, fid: 'A3', emp: null, date: t.date, job: t.project, jobNo: no,
        label: `QuickBooks job name omits ${miss.join(', ')}`, evidence: [{src: 'FieldFlo', file: t.file, ref: t.job, text: t.project}, {src: 'QuickBooks', file: 'time by name detail.xlsx', ref: `row ${ql.row}`, text: ql.job}]});
    }
    for (const r of recon) {
      const a = craft(r.shift.position), b = craft((r.lines[0] || {}).item);
      if (a && b && a !== b) jc.push({id: `jp-${r.id}`, fid: 'A3', emp: r.emp, date: r.date, job: r.job, jobNo: r.jobNo, label: `${a} timecard, ${b} pay line`, evidence: r.evidence});
    }
    if (jc.length) {
      const coded = jc.filter(r => r.lines).length, names = jc.filter(r => !r.emp).length;
      add({id: 'A3', short: 'job codes', uc: 'A', sev: 'Low', title: 'Job codes do not line up',
        what: [coded ? `${coded} pay lines are coded as job prep / drive time but paid as training` : '', names ? `the QuickBooks job name for ${jc.find(r => !r.emp).jobNo} omits an address on the FieldFlo job` : '']
          .filter(Boolean).join('; ').replace(/^./, c => c.toUpperCase()) + '.',
        ...why(null, 'CA-LAW-0047'), next: 'Align service items with payroll items and correct the job name.', rows: jc});
    }

    /* ===== B · Meal & Rest Breaks ===== */
    const premiumLines = lines.filter(l => PREMIUM_ITEM.test(l.payItem));
    const memo = lines.filter(l => /premium/i.test(l.notes || ''));
    const memoGroups = new Map();
    for (const l of memo) {
      const m = (l.notes || '').match(/for (\d{1,2})\/(\d{1,2})/);
      const ref = m ? `${period.start.slice(0, 4)}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}` : l.date;
      const k = `${l.emp}|${ref}`;
      if (!memoGroups.has(k)) memoGroups.set(k, {emp: l.emp, date: ref, lines: []});
      memoGroups.get(k).lines.push(l);
    }
    const unpaid = [...memoGroups.values()].filter(g => !premiumLines.some(l => l.emp === g.emp));
    if (unpaid.length) {
      const g0 = unpaid[0];
      add({id: 'B1', short: 'premium', uc: 'B', sev: 'High', title: 'Break premium noted but not paid',
        what: `A premium for ${md(g0.date)} is written in the memo of ${g0.lines.length} pay lines, but the register has no premium pay item${premiumLines.length ? ' for this employee' : ''}.`,
        ...why('premium', 'CA-LAW-0010'), next: 'Confirm whether it was paid in another run; record premiums as their own pay item.',
        rows: unpaid.map(g => {
          const j = parseJob(g.lines[0].job);
          const fs = shiftFor(g.emp, g.date)[0];
          return {id: `pr-${g.emp}-${g.date}`, fid: 'B1', emp: g.emp, date: g.date, job: j.site, jobNo: j.no, shift: fs || null,
            premium: `Noted on ${g.lines.length} lines · not paid`, label: 'Premium not paid',
            evidence: [...g.lines.map(qbRef), ...(fs ? [ffRef(fs)] : [{src: 'FieldFlo', file: '—', ref: '—', text: `No timesheet supplied for ${j.site} on this date`}])]};
        })});
    }

    // meal timing on recorded shifts
    const mealRows = [], mealOk = [];
    for (const s of shifts) {
      if (s.workMin <= 300) continue;
      let issue = null, sev = 'High';
      if (!s.meal) { issue = s.workMin <= 360 ? 'No meal; no waiver on file' : 'No meal recorded'; sev = s.workMin <= 360 ? 'Medium' : 'High'; }
      else if (mins(s.meal[0]) - mins(s.start) > 300) issue = 'Meal started after the 5th hour';
      else if (mins(s.meal[1]) - mins(s.meal[0]) < 30) issue = 'Meal shorter than 30 min';
      else if (s.workMin > 600) issue = 'No second meal after 10 h';
      if (!issue) { mealOk.push(s); continue; }
      const paid = premiumLines.some(l => l.emp === s.emp && l.date === s.date);
      mealRows.push({id: `ml-${s.date}-${s.i}`, fid: 'B2', emp: s.emp, date: s.date, job: s.ts.project, jobNo: s.jobNo, shift: s, sev,
        premium: paid ? 'Premium paid' : (useQB && s.inPeriod ? 'No premium paid' : 'Payroll not available'), label: issue, evidence: [ffRef(s)]});
    }
    if (mealRows.length) add({id: 'B2', short: 'meal', uc: 'B', sev: mealRows.some(r => r.sev === 'High') ? 'High' : 'Medium', title: 'Meal break problems in time records',
      what: `${mealRows.length} recorded shifts show a missing, late or short meal.`, ...why('lateMeal', 'CA-LAW-0010'),
      next: 'Pay the meal premium or document the reason.', rows: mealRows});

    // rest breaks
    const restShifts = shifts.filter(s => restRequired(s.workMin) > 0);
    const restNeeded = sum(restShifts, s => restRequired(s.workMin));
    if (restShifts.length) add({id: 'B3', short: 'rest breaks', uc: 'B', sev: 'Medium', title: 'Rest breaks not recorded',
      what: `FieldFlo records no 10-minute rest breaks; ${restShifts.length} shifts called for ${restNeeded}.`,
      ...why('rest', 'CA-LAW-0012'), next: 'Record rest breaks, or a per-shift rest sign-off from each employee.',
      rows: restShifts.map(s => ({id: `r-${s.date}-${s.i}`, fid: 'B3', emp: s.emp, date: s.date, job: s.ts.project, jobNo: s.jobNo, shift: s,
        restNeed: restRequired(s.workMin), label: `0 of ${restRequired(s.workMin)} rest breaks recorded`, evidence: [ffRef(s)]}))});

    // identical meal windows for the crew
    const groupRows = [];
    for (const t of timesheets) {
      const ms = shifts.filter(s => s.ts === t && s.meal);
      if (ms.length >= 3 && new Set(ms.map(s => s.meal.join('-'))).size === 1)
        for (const s of ms) groupRows.push({id: `g-${s.date}-${s.i}`, fid: 'B4', emp: s.emp, date: s.date, job: t.project, jobNo: s.jobNo, shift: s,
          label: 'Crew meal time', evidence: [ffRef(s)]});
    }
    if (groupRows.length) {
      const w = groupRows[0].shift.meal;
      const sheets = new Set(groupRows.map(r => r.shift.ts.file)).size;
      add({id: 'B4', short: 'crew meal time', uc: 'B', sev: 'Medium', title: 'Same meal time for the whole crew',
        what: `All ${groupRows.length} meals on ${sheets === 1 ? 'the timesheet' : `${sheets} timesheets`} read ${t12(w[0])}–${t12(w[1])}, so they look scheduled rather than punched.`,
        ...why('group', 'CA-LAW-0003'), next: 'Collect individual meal punches.', rows: groupRows});
    }

    // supervisor break attestation timing
    const attRows = [];
    for (const a of activity) {
      const crew = shifts.filter(s => s.date === a.date && s.job === a.job);
      if (!crew.length) continue;
      const lastEnd = Math.max(...crew.map(s => mins(s.end)));
      if (mins(a.attestedAt) < lastEnd) {
        const fs = crew.find(s => tokens(s.name).join() === tokens(a.attestedBy).join()) || crew[0];
        attRows.push({id: `at-${a.date}`, fid: 'B5', emp: fs.emp, date: a.date, job: crew[0].ts.project, jobNo: crew[0].jobNo, shift: fs,
          attest: a, early: lastEnd - mins(a.attestedAt), crew: crew.length, label: `Signed ${lastEnd - mins(a.attestedAt)} min before crew end`,
          evidence: [{src: 'FieldFlo', file: a.file, ref: a.job, text: `“${a.breakQuestion}”`, sub: `Signed by ${a.attestedBy} at ${t12(a.attestedAt)}; Yes/No mark not machine-readable`}, ...crew.filter(s => mins(s.end) === lastEnd).map(s => ffRef(s, true))]});
      }
    }
    if (attRows.length) {
      const r = attRows[0];
      add({id: 'B5', short: 'sign-off', uc: 'B', sev: 'Low', title: 'Break sign-off made before the shift ended',
        what: `The foreman answered the daily break question at ${t12(r.attest.attestedAt)}, ${r.early} min before the crew's recorded end.`,
        ...why('attest', 'CA-LAW-0011'), next: 'Collect each employee’s break sign-off after they clock out.', rows: attRows, crew: r.crew});
    }

    /* ---------- illustrative exposure: demo pay rates, never client data ---------- */
    const rates = demoRates(lines);
    const rateOn = (emp, date) => { const d = days.get(`${emp}|${date}`); return (d && rates.dayRate(d.lines)) || (rates.base.get(emp) || {}).rate || null; };
    const price = (r, hours, basis, calc) => { const rate = rateOn(r.emp, r.date); if (!rate) return; r.rate = rate; r.hoursAtIssue = r2(hours); r.calc = calc; r.dollars = r2(hours * rate); r.basis = basis; };
    for (const f of findings) for (const r of f.rows) {
      if (f.id === 'A1') price(r, r.otShort * 0.5, 'owed', `${r2(r.otShort)} h overtime at the extra half rate`);            // half-time premium on hours already paid straight
      else if (f.id === 'A0' && r.diff < 0) price(r, -r.diff, 'owed', `${r2(-r.diff)} h unpaid`);  // recorded but unpaid hours
      else if (f.id === 'B1' || f.id === 'B2') price(r, 1, 'owed', '1 h premium');     // one hour of premium pay
      else if (f.id === 'B3' || f.id === 'B4') price(r, 1, 'risk', f.id === 'B3' ? '1 h rest premium' : '1 h meal premium');     // premium owed only if the break can't be substantiated
    }
    for (const f of findings) { f.dollars = r2(sum(f.rows, r => r.dollars || 0)); f.basis = (f.rows.find(r => r.basis) || {}).basis || null; }
    const exposure = {owed: r2(sum(findings.filter(f => f.basis === 'owed'), f => f.dollars)), atRisk: r2(sum(findings.filter(f => f.basis === 'risk'), f => f.dollars)),
      demo: true, itemRates: DEMO_ITEM_RATE, bands: BANDS, rated: rates.base.size, baseOf: e => (rates.base.get(e) || {}).rate || null};
    exposure.total = r2(exposure.owed + exposure.atRisk);

    /* ---------- coverage, passes, totals ---------- */
    const longDays = [...days.values()].filter(d => d.worked > 5);
    const longWithMeal = longDays.filter(d => shiftFor(d.emp, d.date).length);
    const tenHour = longDays.filter(d => d.worked >= 10 && !shiftFor(d.emp, d.date).length).length;
    const ex = findings.filter(f => f.rows.length);
    const rowsOf = uc => ex.filter(f => f.uc === uc).flatMap(f => f.rows.map(r => ({...r, sev: r.sev || f.sev, finding: f})));
    const rank = {High: 0, Medium: 1, Low: 2};
    const ucSummary = uc => {
      const fs = ex.filter(f => f.uc === uc).sort((a, b) => rank[a.sev] - rank[b.sev] || b.rows.length - a.rows.length);
      const rows = rowsOf(uc);
      const people = new Set(rows.map(r => r.emp).filter(Boolean));
      return {findings: fs, rows, exceptions: rows.length, high: rows.filter(r => r.sev === 'High').length, people,
        sev: fs.length ? fs[0].sev : 'Pass'};
    };
    const A = ucSummary('A'), B = ucSummary('B');
    A.matched = matchedRows; A.pending = pending; A.reconciled = recon.length;
    A.otHours = (findings.find(f => f.id === 'A1') || {}).hours || 0;
    A.longDays = otRows.length + otOk; A.longPaidStraight = otRows.length; A.otOk = otOk;
    B.mealOk = mealOk; B.restNeeded = restNeeded; B.restShifts = restShifts.length;
    B.premiumsNoted = memoGroups.size; B.premiumsPaid = memoGroups.size - unpaid.length; B.premiumLines = premiumLines.length;
    B.coverage = {paidLong: longDays.length, withMeal: longWithMeal.length, tenHour};
    const allPeople = new Set([...A.people, ...B.people]);
    A.dollars = r2(sum(A.findings, f => f.dollars || 0)); B.owed = r2(sum(B.findings.filter(f => f.basis === 'owed'), f => f.dollars)); B.atRisk = r2(sum(B.findings.filter(f => f.basis === 'risk'), f => f.dollars));

    /* ---------- coverage of every complaint count ---------- */
    const COUNT_FIND = {1: ['A0', 'A2', 'A3', 'A4'], 2: ['A1'], 3: ['B1', 'B2', 'B4'], 4: ['B3', 'B5']};
    const SHORT = ['Unpaid wages', 'Overtime', 'Meal periods', 'Rest periods', 'Untimely payment', 'Wage statements', 'Waiting time', 'Expense reimbursement', 'Unfair competition'];
    const LATER = {5: 'pay dates and payroll close dates', 6: 'wage statements (pay stubs)', 7: 'separation dates and final-pay records', 8: 'the Expense & Travel Agent (coming soon)', 9: 'results from Counts 1–8'};
    const coverage = complaint ? complaint.counts.map(c => {

    if (memo.key !== key) memo = {key, R: Engine.analyse(D, S.sel)};
    return memo.R;
  };
  // files in the analysis: payroll and time files while their agent is active; case files once the Case Review Agent is active
  const selFiles = src => src === 'cases' ? (active('casereview') ? S.sel.cases || [] : []) : (active(src === 'fieldflow' ? 'fieldflo' : 'quickbooks') ? S.sel[src] || [] : []);
  const srcStats = src => {
    const sel = selFiles(src);
    if (src === 'fieldflow') {
      const ts = D.ff.timesheets.filter(t => sel.includes(t.file));
      return {shifts: ts.reduce((n, t) => n + t.shifts.length, 0), days: ts.length, reports: D.ff.activity.filter(a => sel.includes(a.file)).length, files: sel.length};
    }
    if (src === 'quickbooks') {
      const on = sel.includes('time by name detail.xlsx');
      return {lines: on ? D.qb.lines.length : 0, employees: on ? new Set(D.qb.lines.map(l => l.emp)).size : 0, on, files: sel.length};
    }
    const cf = D.sources.cases.files.find(f => f.kind === 'Complaint');
    return {complaint: sel.includes(cf.name), counts: sel.includes(cf.name) ? D.complaint.counts.length : 0, files: sel.length};
  };
  const period = () => { const m = D.qb.meta.period.match(/(\w+) (\d+) - (\d+), (\d{4})/); const mo = ['january','february','march','april','may','june','july','august','september','october','november','december'].indexOf(m[1].toLowerCase()) + 1; return {start: `${m[4]}-${String(mo).padStart(2, '0')}-${m[2].padStart(2, '0')}`, end: `${m[4]}-${String(mo).padStart(2, '0')}-${m[3].padStart(2, '0')}`}; };
  const readiness = () => {
    const ff = srcStats('fieldflow'), qb = srcStats('quickbooks'), cf = srcStats('cases');
    const p = period();
    const overlap = qb.on ? D.ff.timesheets.filter(t => selFiles('fieldflow').includes(t.file) && t.date >= p.start && t.date <= p.end).length : 0;
    return {ff, qb, cf, overlap, ok: requiredActive() && ff.shifts > 0 && qb.on};

  const uploaded = () => (S.notices && S.notices.files) || [];

  /* ---------- organization profile: fields and where prefilled values come from ---------- */
  const ORG_FIELDS = [

    {k: 'legal', l: 'Legal business name', req: 1},

    {k: 'address', l: 'Business address', req: 1, span: 1},
    {k: 'contactName', l: 'Primary contact name', req: 1},
    {k: 'contactEmail', l: 'Primary contact email', req: 1, type: 'email'},
    {k: 'employees', l: 'Number of employees', type: 'number'},

  const PROV_TIP = {signup: 'Entered when the account was created', record: 'Read from your FieldFlo or QuickBooks records', reference: 'Taken from documents you shared with Prempta, such as the use-case proposal. It doesn’t come from a connected system, so confirm it.', entered: 'Typed or changed on this screen'};
  const recordValues = () => {
    const jobs = new Set(D.qb.lines.map(l => Engine.parseJob(l.job).no).filter(Boolean)).size;
    return {
      legal: [D.qb.meta.company, 'record', 'QuickBooks report header'],
      address: [D.org.address, 'record', 'FieldFlo timesheet header'],
      industry: ['Environmental remediation · asbestos & lead abatement', 'reference', 'From the use-case proposal you shared with Prempta. Confirm it.'],
      employees: [new Set(D.qb.lines.map(l => l.emp)).size, 'record', 'Employees paid in the QuickBooks export'],
      jobs: [jobs, 'record', 'Job numbers in the QuickBooks export'],

  const orgInitial = () => {
    if (S.org) return {vals: {...S.org}, prov: {...(S.org.prov || {})}, tips: S.org.tips || {}};
    const a = S.account || {}, vals = {}, prov = {}, tips = {};
    const put = (k, v, p, t) => { if (v == null || v === '') return; vals[k] = v; prov[k] = p; if (t) tips[k] = t; };
    put('name', a.org, 'signup'); put('legal', a.legal, 'signup');
    put('contactName', a.name, 'signup'); put('contactEmail', a.email, 'signup');
    // the sample records are Watkins Environmental's; offer them only to that organization
    if (/watkins/i.test(a.org || '')) for (const [k, [v, p, t]] of Object.entries(recordValues())) if (vals[k] == null) put(k, v, p, t);
    return {vals, prov, tips};
  };

  /* ---------- theme ---------- */
  const theme = () => document.documentElement.getAttribute('data-theme') || 'light';
  const themeBtn = () => `<button class="icon-btn" data-act="theme" aria-label="Switch to ${theme() === 'dark' ? 'light' : 'dark'} theme" data-tip="${theme() === 'dark' ? 'Light' : 'Dark'} theme">${ic(theme() === 'dark' ? 'sun' : 'moon')}</button>`;

  /* ---------- chrome: one seven-step journey on every screen ---------- */
  const STEPS = [{l: 'Sign up', to: null}, {l: 'Organization', to: 'org'}, {l: 'Agents', to: 'agents'}, {l: 'Readiness', to: 'ready'}, {l: 'Analyze', to: 'run'}, {l: 'Insights', to: 'overview'}, {l: 'Review', to: 'hours'}];
  const STEP_OF = {signup: 0, login: 0, org: 1, agents: 2, ready: 3, run: 4, overview: 5, hours: 6, breaks: 6};
  // why each step is locked right now (null = open), and which steps are complete
  const stepState = () => {
    const req = AGENTS.filter(a => a.required), n = req.filter(a => active(a.k)).length, ok = !!S.org && readiness().ok, ran = !!S.analysed && ok;
    return {
      done: [!!S.user, !!S.org, n === req.length, ran, ran, false, ran && reviewProg().done === reviewProg().total],
      lock: [null, S.user ? null : 'Create your account first.', S.org ? null : 'Save the organization profile first.',
        n === req.length ? null : `Activate the QuickBooks and FieldFlo agents first (${n} of ${req.length} active).`,
        ok ? null : 'Readiness needs payroll and time records from the QuickBooks and FieldFlo agents first.',
        ran ? null : 'Run the analysis first.', ran ? null : 'Run the analysis first.'],
    };
  };
  const stepper = cur => {
    const ix = STEP_OF[cur] ?? -1, {done, lock} = stepState();
    return `<ol class="steps" aria-label="Your journey">${STEPS.map((s, i) => {
      const on = i === ix, isDone = !on && (done[i] || (i < ix && !lock[i])), locked = !on && i > 0 && !!lock[i];
      const n = `<span class="n">${isDone ? ic('check', 'sm') : i + 1}</span><span class="lbl">${s.l}</span>`;
      let inner;
      if (on) inner = `<span class="stp" aria-current="step" data-tip="${esc(i === 6 && S.analysed ? `Step 7 of 7: Review. ${reviewProg().done} of ${reviewProg().total} flagged records reviewed.` : `Step ${i + 1} of 7: ${s.l}. You are here.`)}">${n}</span>`;
      else if (i === 0) inner = `<span class="stp" tabindex="0" data-tip="${esc(S.user ? `Sign up is done. Signed in as ${S.user.email}.` : 'Create your account to begin.')}">${n}${S.user ? '<span class="sr">, done</span>' : ''}</span>`;
      else if (locked) inner = `<span class="stp" tabindex="0" role="link" aria-disabled="true" data-tip="${esc(`${s.l} is locked. ${lock[i]}`)}">${n}<span class="sr">, locked. ${esc(lock[i])}</span></span>`;
      else inner = `<a class="stp" href="#/${s.to}" data-tip="${esc(i === 4 && S.analysed ? 'Analyze is done. Select to run the analysis again.' : i === 6 ? `Review: ${reviewProg().done} of ${reviewProg().total} flagged records reviewed.` : `${s.l}${isDone ? ' is done. Select to revisit.' : ' is ready. Select to continue.'}`)}">${n}${isDone ? '<span class="sr">, done</span>' : ''}</a>`;
      return `<li class="${on ? 'on' : isDone ? 'done' : locked ? 'lock' : 'open'}">${inner}</li>`;
    }).join('')}</ol>`;
  };
  const userMenu = () => `<div class="user"><button class="avatar" data-act="menu" aria-haspopup="menu" aria-expanded="${U.menu}" aria-label="Account menu">${esc(initials(S.user.name))}</button>${U.menu ? `
    <div class="menu" role="menu"><div class="who"><b>${esc(S.user.name)}</b><span class="muted">${esc(S.user.email)}</span></div>
      ${S.org ? `<button role="menuitem" data-act="go" data-to="org">${ic('building', 'sm')}Organization profile</button>` : ''}
      ${S.org ? `<button role="menuitem" data-act="go" data-to="agents">${ic('plug', 'sm')}Agents</button>` : ''}

      ${S.analysed ? `<button role="menuitem" data-act="rerun">${ic('refresh', 'sm')}Run the analysis again</button>` : ''}
      <button role="menuitem" data-act="reset"${U.confirmReset ? ' class="danger"' : ''}>${ic('reset', 'sm')}${U.confirmReset ? 'Erase all demo data? Select again' : 'Start the demo over'}</button>

  const top = cur => {

      <nav class="journey" aria-label="Steps">${STEP_OF[cur] != null ? `<div class="journey-sm" aria-hidden="true"><span><b>Step ${STEP_OF[cur] + 1} of 7</b> ${STEPS[STEP_OF[cur]].l}</span><span class="jbar"><i style="width:${Math.round((STEP_OF[cur] + 1) / 7 * 100)}%"></i></span></div>` : ''}<div class="journey-in">${stepper(cur)}</div></nav></header>`;
  };
  const copyLine = v => `<span class="copyline"><span class="mono">${esc(v)}</span><button class="icon-btn sm" type="button" data-act="copy" data-v="${esc(v)}" aria-label="Copy ${esc(v)}" data-tip="Copy">${ic('copy', 'sm')}</button></span>`;

  const err = (form, k) => (U.errs[form] || {})[k];
