    return `<div class="field${o.span ? ' span' : ''}${e ? ' bad' : ''}"><div class="lab"><label for="${id}">${esc(o.l)}${o.req ? ' <span class="req" aria-hidden="true">*</span>' : ''}</label>${o.chip || ''}</div>${ctl}${e ? `<span class="err" id="${id}-e">${esc(e)}</span>` : o.hint ? `<span class="hint">${o.hint}</span>` : ''}</div>`;
  };
  const chip = (p, t) => `<span class="chip c-${p}"${t ? ` data-tip="${esc(t)}"` : ''}>${PROV[p]}</span>`;

  /* ---------- sign up / sign in ---------- */
  function vSignup() {
    const v = U.signup || {};
    return `<main class="center auth-main"><div class="auth wide view">${brand()}
      <div class="auth-steps">${stepper('signup')}</div>
      <form class="card-form" data-form="signup" novalidate>
        <div class="form-head"><div><h1>Create your account</h1><p>Start with you and your organization. The rest comes from your data.</p></div>
          <button class="btn btn-secondary btn-sm" type="button" data-act="demo-signup">${ic('spark', 'sm')}Use demo details</button></div>
        <div class="form-sec"><h2>About you</h2><div class="fgrid">
          ${field('su', {k: 'name', l: 'Full name', req: 1, value: v.name, ac: 'name'})}
          ${field('su', {k: 'email', l: 'Work email', req: 1, type: 'email', value: v.email, ac: 'email', hint: 'You become the primary contact and first administrator.'})}
          ${field('su', {k: 'password', l: 'Password', req: 1, type: 'password', value: v.password, ac: 'new-password', span: 1, hint: 'At least 8 characters. This demo does not store it.'})}
        </div></div>
        <div class="form-sec"><h2>Your organization</h2><div class="fgrid">
          ${field('su', {k: 'org', l: 'Organization name', req: 1, value: v.org, ac: 'organization', hint: 'Shown in the header and on reports.'})}
          ${field('su', {k: 'legal', l: 'Legal business name', req: 1, value: v.legal, hint: 'As it appears on payroll.'})}
        </div><p class="rules-line">${ic('shield', 'sm')}Checks follow ${num(D.ruleCatalogSize)} California wage-and-hour rules</p></div>
        <div class="form-foot"><span class="muted">Already have an account? <a href="#/login">Sign in</a></span><button class="btn btn-primary btn-lg" type="submit">Create account ${ic('right', 'sm')}</button></div>
      </form>
      <p class="auth-foot">Read-only access. Your source systems are never changed.</p>
      <div style="justify-self:center">${themeBtn()}</div></div></main>`;
  }
  function vLogin() {
    const em = S.account ? S.account.email : 'demo@prempta.ai';
    return `<main class="center auth-main"><div class="auth view">${brand()}
      <form class="panel" data-form="login" novalidate>
        <div><h1>Sign in</h1><p class="muted">PAGA compliance insights</p></div>
        <div class="field"><label for="em">Work email</label><input class="input" id="em" type="email" value="${esc(em)}" autocomplete="username" required></div>
        <div class="field"><label for="pw">Password</label><input class="input" id="pw" type="password" value="prempta-demo" autocomplete="current-password" required></div>
        <p class="err" id="lerr" role="alert" hidden></p>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Sign in</button>
        <p class="muted" style="text-align:center;font-size:13px">New to PREMPTA? <a href="#/signup">Create an account</a></p>
      </form>
      <p class="auth-foot">Read-only access. Your source systems are never changed.</p>
      <div style="justify-self:center">${themeBtn()}</div></div></main>`;
  }

  /* ---------- organization profile ---------- */
  function vOrg() {
    const init = orgInitial(), d = U.orgDraft || init;
    const fieldsHtml = ORG_FIELDS.map(f => {
      const v = d.vals[f.k] ?? '', p0 = init.prov[f.k] || 'missing', p = d.prov[f.k] || (v === '' ? 'missing' : 'entered');
      const hint = f.k === 'employees' && init.prov.employees === 'record' ? 'From the payroll export; change it if it differs.' : f.k === 'jobs' && init.prov.jobs === 'record' ? 'Job numbers with hours in the payroll export.' : '';
      return field('org', {...f, value: v, hint, chip: chip(p, (d.tips || init.tips)[f.k] || PROV_TIP[p]),
        attrs: ` data-init="${esc(init.vals[f.k] ?? '')}" data-initp="${p0}" data-orgf="1"`});
    }).join('');
    return `${top('org')}<main class="view"><div class="narrow">

      <form class="card-form" data-form="org" novalidate>
        <p class="legend-note">${ic('info', 'sm')}<span>The label beside each field says where its value came from: sign-up, your records, your documents, or you. Values from your documents don’t come from a connected system, so confirm them before saving.</span></p>
        <div class="form-sec"><div class="fgrid">${fieldsHtml}</div></div>

      </form></div></main>`;
  }
  /* ---------- agents: the ecosystem and each agent's setup, side by side ---------- */
  const statusChip = s => `<span class="st st-${s}" data-tip="${esc(ST_TIP[s])}">${esc(ST[s])}${s === 'testing' ? '…' : ''}</span>`;
  const groupBadge = a => { const g = GROUPS.find(x => x.k === a.group); return `<span class="gb gb-${g.k}" data-tip="${esc(g.tip)}">${esc(g.l)}</span>`; };
  const chk = (ok, label, val, opt) => `<li><span class="${ok ? 'ok-dot' : 'no-dot'}">${ic(ok ? 'check' : 'minus')}</span>${label}: <b>${val}</b>${opt ? ` <span class="muted">(${opt})</span>` : ''}</li>`;
  const lastLine = k => {
    const s = ag(k);
    if (k === 'notices') return uploaded().length ? `${plural(uploaded().length, 'document')} reviewed` : 'Watching the folder';
    if (k === 'casereview') return s.last ? `${plural(D.sources.cases.files.length, 'case file')} retrieved` : 'Connected';

  const nextLine = k => {

    if (a.group === 'live') return `Last checked ${WATCH.checked}`;
    if (s.status === 'testing') return 'Checking the connection…';
    if (s.status === 'active') return lastLine(k);
    if (shown(k) === 'ready') return `Next: save and check the ${a.kind === 'folder' ? 'folder' : 'connection'}`;
    const items = checklist(k), miss = items.find(x => !x[1]);
    return miss ? `Next: ${miss[2]} · ${items.filter(x => x[1]).length} of ${items.length} done` : `Next: save and check the ${a.kind === 'folder' ? 'folder' : 'connection'}`;

  function agentCard(a) {

    }).join('')}</div>`;

    return `<div class="case-card"><div class="case-h">${ic('scale', 'sm')}<b>Case review: ${esc(c.label)}</b><span class="tag sim">Retrieval simulated</span></div>

        <dt>Court and date</dt><dd>${esc(c.court)}, filed ${esc(c.filed)}</dd>
        <dt>Counts</dt><dd>${c.causes} causes of action<ol class="count-list">${c.counts.map(x => `<li><b>${x.n}</b>${esc(COUNT_NAME[x.n - 1])}</li>`).join('')}</ol></dd>
        <dt>Allegations</dt><dd>General allegations in paragraphs ${c.allegations[0]} to ${c.allegations[1]}, of ${c.paragraphs} paragraphs</dd>
        <dt>Class</dt><dd>“${esc(c.classDef)}” <span class="muted">(${esc(paraText(c.classPara))})</span></dd>

  // an LWDA document, as the PAGA Notice Agent reads it
  function docReview() {
    if (U.reviewing) return `<ol class="test-steps in" aria-live="polite">${['Reading the PDF', 'Identifying the document', 'Pulling out dates, actions and evidence'].map((t, i) => `<li class="${i < U.reviewStep ? 'done' : i === U.reviewStep ? 'now' : ''}"><span class="ic">${i < U.reviewStep ? ic('check') : ''}</span>${t}</li>`).join('')}</ol>`;

    return `<article class="doc-review" aria-label="Document review">
      <div class="dr-h">${ic('file')}<div><b>${esc(CURE.file)}</b><small>${esc(CURE.kind)} · reviewed ${when(S.notices.at)}</small></div><span class="tag">Not linked to ${esc(org)}</span></div>
      <p class="dr-note">${ic('info', 'sm')}<span>${esc(CURE.matter)} No deadlines were added for ${esc(org)}.</span></p>
      <dl class="kv"><dt>Issued by</dt><dd>${esc(CURE.issuer)}</dd><dt>Basis</dt><dd>${esc(CURE.basis)}</dd>${CURE.facts.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}

    const jr = app.querySelector('.journey-in'), jon = jr && jr.querySelector('.on'); // keep the current step in view on narrow screens
    if (jr && jon && jr.scrollWidth > jr.clientWidth) jr.scrollLeft = jon.offsetLeft - jr.clientWidth / 2 + jon.offsetWidth / 2;
    for (const [k, val] of Object.entries(secrets)) { const x = app.querySelector(`form[data-form="agent"][data-k="${k}"] input[name="secret"]`); if (x) x.value = val; }
    document.title = `${TITLES[v]} · PREMPTA AI`;
    if (changed && !keepScroll) window.scrollTo(0, 0);
    if (v === 'run' && changed) animateRun();
    if (changed) { const h = app.querySelector('h1'); if (h) { h.setAttribute('tabindex', '-1'); if (v !== 'login' && v !== 'signup') h.focus({preventScroll: true}); } }
  }
  const go = v => { U.menu = false; if (location.hash === `#/${v}`) render(); else location.hash = `#/${v}`; };
  window.addEventListener('hashchange', () => { U.menu = false; render(); });
  const focusFirstError = () => { const b = app.querySelector('.field.bad input, .field.bad select, .field.bad'); if (b) { (b.matches('input,select') ? b : b.querySelector('input') || b).focus(); } };
  const clearErrors = form => { form.querySelectorAll('.field.bad').forEach(f => { f.classList.remove('bad'); const m = f.querySelector('.err'); if (m) m.remove(); }); form.querySelectorAll('[aria-invalid]').forEach(x => x.removeAttribute('aria-invalid')); U.errs = {}; };
  const formVals = form => { const v = {}; for (const el of form.elements) if (el.name && el.type !== 'checkbox') v[el.name] = el.value; return v; };
  const toast = msg => { U.toast = msg; clearTimeout(U.toastTimer); render(true); U.toastTimer = setTimeout(() => { U.toast = null; render(true); }, 2200); };

  /* ---------- agents: save, test, receive ---------- */
  function lastFor(k) {
    if (k === 'quickbooks') return {label: `${D.qb.meta.report} · ${range(period())}`, detail: `${num(D.qb.lines.length)} pay lines · ${new Set(D.qb.lines.map(l => l.emp)).size} employees`, at: stamp()};
    if (k === 'fieldflo') {
      const files = S.sel.fieldflow || [], latest = files.slice().sort().reverse()[0] || 'none';
      return {label: latest, detail: `${plural(files.length, 'file')} received`, at: stamp()};
    }
    if (k === 'casereview') {
      const used = D.sources.cases.files.filter(f => f.use).length;
      return {label: draftOf(k).folder, detail: `${plural(D.sources.cases.files.length, 'file')} retrieved · ${used} used`, at: stamp()};
    }
    return {label: draftOf(k).folder, detail: `${plural(D.sources.notices.files.length, 'document')} found · read access confirmed`, at: stamp()};
  }
  function startTest(k) {
    const a = AG[k];
    S.ag[k] = {...(S.ag[k] || {}), status: 'testing'};
    U.testStep[k] = 0; save(); render(true);
    clearTimeout(U.testTimer[k]);
    const tick = () => {
      U.testStep[k]++;
      if (U.testStep[k] >= a.test.length) {
        const last = lastFor(k);
        Object.assign(S.ag[k], {status: 'active', testedAt: stamp(), last});
        if (k === 'casereview') { S.sel.cases = defaults('cases'); S.ag[k].case = true; }
        if (k === 'notices') { clearTimeout(U.reviewTimer); U.reviewTimer = setTimeout(reviewSample, 350); } // new files in the folder are reviewed straight away
        S.analysed = false; save(); announce(`${a.name} is active.${k === 'fieldflo' || k === 'quickbooks' ? (requiredActive() ? ' Readiness is unlocked.' : '') : ''}`);
      }
      if (current === 'agents') render(true);
      if (S.ag[k].status === 'testing') U.testTimer[k] = setTimeout(tick, 520);
    };
    U.testTimer[k] = setTimeout(tick, 520);
  }
  function saveAgent(k, form) {
    const a = AG[k], c = draftOf(k), f = `ag-${k}`, e = {};
    const secret = form.elements.secret ? String(form.elements.secret.value || '') : '';
    if (form.elements.secret) form.elements.secret.value = ''; // the typed credential goes no further than this line
    c.secretTyped = false;
    const stored = (S.ag[k] && S.ag[k].cfg && S.ag[k].cfg.credRef) || '';
    if (a.kind === 'api') {
      if (!String(c.company).trim()) e.company = 'Enter the QuickBooks company.';
      if (!c.tokenRef) e.tokenRef = 'Authorize QuickBooks first.';
      if (!c.data.includes('time')) e.data = 'Payroll time detail is needed for the analysis.';
    } else if (a.kind === 'mailbox') {
      if (!isEmail(c.mailbox)) e.mailbox = 'Enter a valid mailbox address.';
      if (!senderList(c.senders).length) e.senders = 'Add at least one sender address or domain.';
      if (!c.reports.length) e.reports = 'Choose at least one report.';
    } else if (a.kind === 'folder') {
      if (!isPath(c.folder)) e.folder = String(c.folder).trim() ? 'Enter a full folder path, such as \\\\fileserver\\Legal\\PAGA Notices or /legal/paga-notices.' : 'Enter the folder where PAGA notices are saved.';
      if (!isEmail(c.owner)) e.owner = 'Enter the case owner’s email.';
      if (c.counsel && !isEmail(c.counsel)) e.counsel = 'Enter a valid email, or leave it blank.';
      if (!c.docs.length) e.docs = 'Choose at least one document type.';
    } else {
      if (!isHost(c.host)) e.host = 'Enter a server name, such as sftp.example.com.';
      if (!/^\d{1,5}$/.test(String(c.port).trim())) e.port = 'Enter a port number, such as 22.';
      if (!/^\//.test(String(c.folder).trim())) e.folder = 'Enter a folder path that starts with /.';
      if (!String(c.user).trim()) e.user = 'Enter the sign-in user.';
      if (!c.types.length) e.types = 'Choose at least one file type.';
    }
    if (a.kind === 'mailbox' || a.kind === 'sftp') {
      if (!secret && !stored) e.secret = a.kind === 'sftp' ? 'Enter the SFTP credential.' : 'Enter the credential for this mailbox.';
      else if (secret && Object.keys(e).length) e.secret = 'For safety the value was cleared. Enter it again.';
    }
    if (Object.keys(e).length) { U.errs[f] = e; render(true); focusFirstError(); return; }
    U.errs[f] = {};
    const cfg = {...c};
    delete cfg.secretTyped;
    if (a.kind === 'mailbox') cfg.mailbox = c.mailbox.trim().toLowerCase();
    if (a.kind === 'folder') cfg.folder = String(c.folder).trim();
    if (a.kind === 'mailbox' || a.kind === 'sftp') cfg.credRef = secret ? `vault://${slug(S.org.name)}/${k}/${hex6()}` : stored;
    S.ag[k] = {...(S.ag[k] || {}), cfg};
    U.draft[k] = {...cfg};
    if (k === 'fieldflo') S.sel.fieldflow = D.sources.fieldflow.files.filter(x => x.use && a.reports.filter(r => cfg.reports.includes(r.k)).map(r => r.kind).includes(x.kind)).map(x => x.name);
    if (k === 'quickbooks') S.sel.quickbooks = cfg.data.includes('time') ? ['time by name detail.xlsx'] : [];
    startTest(k);
  }
  function syncDraft(form) {
    const k = form.dataset.k, c = draftOf(k);
    for (const el of form.elements) {
      if (!el.name || el.name === 'secret') continue;
      if (el.type === 'checkbox') c[el.name] = [...form.querySelectorAll(`input[name="${el.name}"]:checked`)].map(x => x.value);
      else c[el.name] = el.value;
    }
    c.secretTyped = !!(form.elements.secret && form.elements.secret.value);
    const box = app.querySelector('.complete'); // keep the completeness meter honest while typing
    if (box) {
      const items = checklist(k), done = items.filter(x => x[1]).length;
      box.querySelector('.complete-h span').textContent = `${done} of ${items.length} complete`;
      box.querySelector('.track i').style.width = `${Math.round(done / items.length * 100)}%`;
      box.querySelectorAll('.complete-l li').forEach((li, i) => { const ok = items[i][1]; li.className = ok ? 'ok' : ''; li.querySelector('svg').outerHTML = ic(ok ? 'check' : 'minus', 'sm'); });
    }
  }

  /* ---------- actions ---------- */
  app.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (!t) { if (U.menu && !e.target.closest('.menu')) { U.menu = false; U.confirmReset = false; render(true); } return; }
    const a = t.dataset.act;
    if (a !== 'menu' && U.menu && !t.closest('.menu')) U.menu = false;
    if (a !== 'reset') U.confirmReset = false;
    if (a === 'theme') {
      const n = theme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', n);
      try { localStorage.setItem(THEME, n); } catch (err) { /* keep for this visit */ }
      render(true);
    } else if (a === 'menu') { U.menu = !U.menu; render(true); }
    else if (a === 'demo-signup') {
      const form = app.querySelector('form[data-form="signup"]');
      const demo = {name: 'Alex Morgan', email: 'alex.morgan@watkins.example', password: 'demo-password-2026', org: 'Watkins Environmental', legal: D.qb.meta.company};
      for (const [k, v] of Object.entries(demo)) if (!form.elements[k].value) form.elements[k].value = v;
      clearErrors(form);
    }
    else if (a === 'pick') {
      U.pick = t.dataset.k; U.errs = {}; render(true);
      if (window.innerWidth < 1020) { const p = document.getElementById('cfg-panel'); if (p) p.scrollIntoView({behavior: 'smooth', block: 'start'}); }
    }
    else if (a === 'qb-auth') {
      U.busy.auth = true; render(true);
      setTimeout(() => { U.busy.auth = false; draftOf('quickbooks').tokenRef = `vault://${slug(S.org.name)}/quickbooks/${hex6()}`; if (U.errs['ag-quickbooks']) delete U.errs['ag-quickbooks'].tokenRef; render(true); }, 700);
    }
    else if (a === 'demo-cred') {
      const form = t.closest('form'), x = form.elements.secret;
      if (x && !x.value) x.value = 'demo-app-password';
      clearErrors(form); syncDraft(form);
    }
    else if (a === 'open-agent') { U.pick = t.dataset.k; go('agents'); }
    else if (a === 'check-folder') reviewSample();
    else if (a === 'demo-folder') {
      const form = app.querySelector('form[data-form="agent"][data-k="notices"]'), x = form && form.elements.folder;
      if (x && !isPath(x.value)) x.value = `\\\\fs01.${orgDomain()}\\Legal\\PAGA Notices`;
      if (form) { clearErrors(form); syncDraft(form); render(true); }
    }
    else if (a === 'export') exportCsv();
    else if (a === 'disp') {
      S.disp = S.disp || {}; const k = t.dataset.k, v = t.dataset.v, cur = S.disp[k] || {};
      S.disp[k] = {...cur, s: cur.s === v ? null : v, at: stamp()};
      if (!S.disp[k].s && !S.disp[k].note) delete S.disp[k];
      save(); render(true); const p = reviewProg(); announce(`${S.disp[k] && S.disp[k].s ? DISP[S.disp[k].s] : 'Decision cleared'}. ${p.done} of ${p.total} flagged records reviewed.`);
    }
    else if (a === 'bulk') {
      const R = result(), key = t.dataset.key, rows = (key === 'fA' ? R.A.rows : R.B.rows).filter(r => r.fid === U[key]); S.disp = S.disp || {};
      for (const r of rows) { const k = recKey(r); if (!(S.disp[k] || {}).s) S.disp[k] = {...(S.disp[k] || {}), s: 'confirmed', at: stamp()}; }
      save(); render(true); const p = reviewProg(); announce(`Marked as confirmed. ${p.done} of ${p.total} flagged records reviewed.`);
    }
    else if (a === 'toggle-rcv') { e.preventDefault(); U.open[t.dataset.k] = !U.open[t.dataset.k]; render(true); }
    else if (a === 'copy') {
      const v = t.dataset.v;
      const done = () => toast('Copied to the clipboard');
      try { navigator.clipboard.writeText(v).then(done, () => toast(v)); } catch (err) { toast(v); }
    }
    else if (a === 'run' || a === 'rerun') { S.analysed = false; save(); go('run'); }
    else if (a === 'go') go(t.dataset.to);
    else if (a === 'signout') { delete S.user; save(); U.menu = false; go('login'); }
    else if (a === 'reset' && !U.confirmReset) { U.confirmReset = true; U.menu = true; render(true); return; }
    else if (a === 'reset') { U.confirmReset = false; Object.values(U.testTimer).forEach(clearTimeout); clearTimeout(U.reviewTimer); U.reviewing = false; S = fresh(); save(); U.open = {}; U.draft = {}; U.pick = null; U.exp.clear(); U.fA = U.fB = 'ex'; go('signup'); }
    else if (a === 'filter') { U[t.dataset.key] = U[t.dataset.key] === t.dataset.f && t.dataset.f !== 'ex' ? 'ex' : t.dataset.f; render(true); }
    else if (a === 'focus') { U[t.dataset.f[0] === 'A' ? 'fA' : 'fB'] = t.dataset.f; }
    else if (a === 'row') { const id = t.dataset.id; U.exp.has(id) ? U.exp.delete(id) : U.exp.add(id); render(true); const r = app.querySelector(`tr.row[data-id="${CSS.escape(id)}"]`); if (r) r.focus({preventScroll: true}); }
  });
  app.addEventListener('keydown', e => {
    if (e.key === 'Escape' && U.menu) { U.menu = false; render(true); return; }
    const lk = e.target.closest && e.target.closest('[aria-disabled="true"][data-tip]');
    if (lk && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); showTip(lk); return; }
    const r = e.target.closest && e.target.closest('tr.row');
    if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); r.click(); }
  });
  app.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.orgf) { // the value-source chip follows the edit, as in the organization profile
      const v = String(t.value).trim(), p = !v ? 'missing' : v === String(t.dataset.init).trim() ? t.dataset.initp : 'entered';
      const box = t.closest('.field').querySelector('.chip'); if (box) { box.className = `chip c-${p}`; box.textContent = PROV[p]; }
    }
    if (t.form && t.form.dataset.form === 'agent') syncDraft(t.form);
    const f = t.closest('.field.bad'); if (f) { f.classList.remove('bad'); const m = f.querySelector('.err'); if (m) m.remove(); t.removeAttribute('aria-invalid'); }
  });
  app.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.note != null) { S.disp = S.disp || {}; const k = t.dataset.note, v = t.value.trim(); S.disp[k] = {...(S.disp[k] || {}), note: v, at: stamp()}; if (!S.disp[k].s && !v) delete S.disp[k]; save(); return; }
    if (t.form && t.form.dataset.form === 'agent' && !t.dataset.file) { syncDraft(t.form); return; }
    if (t.dataset.file) {
      const list = new Set(S.sel[t.dataset.src] || []);
      t.checked ? list.add(t.dataset.file) : list.delete(t.dataset.file);
      S.sel[t.dataset.src] = [...list]; S.analysed = false;
      save(); render(true);
    }
  });
  app.addEventListener('submit', e => {
    e.preventDefault();
    const form = e.target, f = form.dataset.form;
    if (f === 'login') {
      const em = document.getElementById('em').value.trim(), pw = document.getElementById('pw').value;
      const errEl = document.getElementById('lerr');
      if (!isEmail(em) || !pw) { errEl.textContent = 'Enter a work email and password.'; errEl.hidden = false; return; }
      if (S.account && S.account.email.toLowerCase() === em.toLowerCase()) S.user = {name: S.account.name, email: S.account.email};
      else { const local = em.split('@')[0].replace(/[._-]+/g, ' '); S.user = {email: em, name: local === 'demo' ? 'Demo reviewer' : local.replace(/\b\w/g, c => c.toUpperCase())}; }
      save(); go(S.org ? home() : 'org');
    } else if (f === 'signup') {
      const v = formVals(form), er = {};
      if (!v.name.trim()) er.name = 'Enter your name.';
      if (!isEmail(v.email)) er.email = 'Enter a valid work email.';
      if (v.password.length < 8) er.password = 'Use at least 8 characters.';
      if (!v.org.trim()) er.org = 'Enter the organization name.';
      if (!v.legal.trim()) er.legal = 'Enter the legal business name.';
      if (Object.keys(er).length) { U.errs.su = er; U.signup = {...v, password: ''}; render(true); focusFirstError(); return; }
      S = fresh(); U.draft = {}; U.pick = null;
      S.account = {name: v.name.trim(), email: v.email.trim().toLowerCase(), org: v.org.trim(), legal: v.legal.trim(), createdAt: stamp()};
      S.user = {name: S.account.name, email: S.account.email};
      U.signup = null; save(); go('org');
    } else if (f === 'org') {
      const v = formVals(form), er = {}, prov = {}, tips = orgInitial().tips;
      for (const fd of ORG_FIELDS) {
        const el = form.elements[fd.k], val = String(v[fd.k] || '').trim();
        if (fd.req && !val) er[fd.k] = `Enter the ${fd.l.toLowerCase().replace('organization / ', '')}.`;
        if (fd.type === 'number' && val && !/^\d+$/.test(val)) er[fd.k] = 'Enter a whole number, or leave it blank.';
        prov[fd.k] = el.closest('.field').querySelector('.chip').className.replace('chip c-', '');
      }
      if (v.contactEmail && !isEmail(v.contactEmail)) er.contactEmail = 'Enter a valid email address.';
      if (Object.keys(er).length) { U.errs.org = er; U.orgDraft = {vals: v, prov, tips}; render(true); focusFirstError(); return; }
      const vals = {}; for (const fd of ORG_FIELDS) vals[fd.k] = fd.type === 'number' ? (v[fd.k] ? Number(v[fd.k]) : null) : String(v[fd.k]).trim();
      S.org = {...vals, prov, tips, rules: 'California', complete: true};
      if (U.draft.quickbooks && !U.draft.quickbooks.company) U.draft.quickbooks.company = S.org.legal;
      U.orgDraft = null; save(); go(home());
    } else if (f === 'agent') saveAgent(form.dataset.k, form);
  });
  render();
})();

</script>
</body>
