        <div><dt>Timecards matched</dt><dd>${A.matched.length}<small> of ${A.reconciled}${A.pending.length ? ` · ${A.pending.length} awaiting payroll` : ''}</small></dd></div></dl>
      <h2 class="sr">Findings</h2>
      <div class="fl">${A.findings.map(f => fcard('fA', f)).join('')}
        ${pass.length ? passCard('fA', 'ok', 'Pass', 'Recorded and paid hours match', `${pass.length} of ${A.reconciled} FieldFlow shifts in the pay period match QuickBooks to the minute (${fmtH(pass.reduce((n, r) => n + r.recorded, 0))} each side).`, plural(pass.length, 'shift')) : ''}
        ${pend.length ? passCard('fA', 'pend', 'Pending', 'Awaiting payroll', `${pend.length} FieldFlow shifts on ${[...new Set(pend.map(r => fmtD(r.date)))].join(', ')} fall after the QuickBooks export (${range(p)}).`, plural(pend.length, 'shift')) : ''}</div>
      <div class="tbl-bar"><h2>Records</h2>${segBtns('fA', opts)}</div>
      <div class="tbl-wrap"><table><thead><tr><th>Employee</th><th>Date</th><th>Job</th><th class="r">Recorded</th><th class="r">Paid</th><th class="r">Difference</th><th>Finding</th><th><span class="sr">Details</span></th></tr></thead>
        <tbody>${rows.length ? rows.map(r => rowHtml(R, r, cells(r), fOf(r), 8)).join('') : '<tr><td colspan="8" class="empty">No records in this view.</td></tr>'}</tbody></table></div>
      <p class="note">${ic('info', 'sm')}<span>Not in the source data: timecard edit history and pay rates, so exposure is shown in hours. FieldFlow timesheets cover ${new Set(R.shifts.filter(s => s.inPeriod).map(s => s.date)).size} of ${R.totals.days} payroll days.</span></p>
    </main>`;
  }

  function vBreaks() {
    const R = result(), B = R.B;
    const okRows = B.mealOk.map(s => ({id: `ok-${s.date}-${s.i}`, emp: s.emp, date: s.date, job: s.ts.project, jobNo: s.jobNo, shift: s, sev: 'Pass', label: 'On time · 30 min', evidence: [{src: 'FieldFlow', file: s.ts.file, ref: s.ts.job, text: `${t12(s.start)}–${t12(s.end)} · meal ${t12(s.meal[0])}–${t12(s.meal[1])}`, sub: `verified ${Engine.t12s(s.verifiedAt)}`}]}));
    const mergedB = mergeRows(B.rows);
    const opts = [['ex', 'All flagged', mergedB.length], ...B.findings.map(f => [f.id, f.short[0].toUpperCase() + f.short.slice(1), f.rows.length]), ['ok', 'Compliant meals', okRows.length]].filter(o => o[2] || o[0] === 'ex');
    if (!opts.some(o => o[0] === U.fB)) U.fB = 'ex';
    const rows = (U.fB === 'ex' ? mergedB : U.fB === 'ok' ? okRows : B.rows.filter(r => r.fid === U.fB)).slice().sort(sorter(R));
    const cov = B.coverage;
    const cells = r => {
      const s = r.shift;
      const shift = s ? `<span class="em nw">${t12(s.start)}–${t12(s.end)}</span><span class="sub">${esc(r.jobNo)} · ${fmtH(s.workMin / 60)}</span>` : `<span class="muted">—</span><span class="sub">No timesheet · ${esc(r.jobNo || '')}</span>`;
      const meal = s ? (s.meal ? `<span class="nw">${t12(s.meal[0])}–${t12(s.meal[1])}</span>` : `<span class="muted">None</span><span class="sub">${s.workMin <= 300 ? 'not required' : 'required'}</span>`) : '<span class="muted">—</span>';
      const need = s ? Engine.restRequired(s.workMin) : 0;
      const rest = s && need ? `<span class="diff-bad">0 of ${need}</span>` : '<span class="muted">—</span>';
      const ax = (r.all || [r]).find(x => x.attest);
      const att = ax ? `<span class="nw">Foreman ${t12(ax.attest.attestedAt)}</span><span class="sub">${ax.early} min before end</span>` : s ? `<span>${t12(s.verifiedAt)}</span><span class="sub">hours only</span>` : '<span class="muted">—</span>';
      const prem = r.fid === 'B1' ? `<span class="diff-bad">Not paid</span><span class="sub">noted on ${r.evidence.filter(e => e.src === 'QuickBooks').length} pay lines</span>` : r.premium ? `<span>${esc(r.premium)}</span>` : '<span class="muted">—</span>';
      return `<td>${empCell(R, r)}</td><td>${dateCell(r)}</td><td>${shift}</td><td>${meal}</td><td>${rest}</td><td>${att}</td><td>${prem}</td><td>${findingCell(r)}</td>`;
    };
    const b2 = R.findings.find(f => f.id === 'B2');
    return `${topApp('breaks')}<main class="view">
      <a class="back" href="#/overview">${ic('left', 'sm')}Dashboard</a>
      <div class="head"><div><h1>Meal &amp; Rest Breaks</h1><p>Check meal timestamps, attestations and premium-pay entries.</p></div>${sev(B.sev)}</div>
      <dl class="d-stats">
        <div><dt>Exceptions</dt><dd>${B.exceptions}<small> in ${mergedB.length} records</small></dd></div>
        <div><dt>Employees</dt><dd>${B.people.size}</dd></div>
        <div><dt>Premiums noted, not paid</dt><dd>${B.premiumsNoted - B.premiumsPaid}<small> of ${B.premiumsNoted}</small></dd></div>
        <div><dt>Rest breaks recorded</dt><dd>0<small> of ${B.restNeeded} required</small></dd></div></dl>
      <h2 class="sr">Findings</h2>
      <div class="fl">${B.findings.map(f => fcard('fB', f)).join('')}
        ${okRows.length ? passCard('fB', 'ok', 'Pass', 'Recorded meals on time', `${okRows.length} of ${okRows.length + (b2 ? b2.rows.length : 0)} recorded meals start before the 5th hour and last 30 minutes.`, plural(okRows.length, 'meal')) : ''}</div>
      <div class="tbl-bar"><h2>Records</h2>${segBtns('fB', opts)}</div>
      <div class="tbl-wrap"><table><thead><tr><th>Employee</th><th>Date</th><th>Shift</th><th>Meal</th><th>Rest breaks</th><th>Attestation</th><th>Premium pay</th><th>Finding</th><th><span class="sr">Details</span></th></tr></thead>
        <tbody>${rows.length ? rows.map(r => rowHtml(R, r, cells(r), r.finding || null, 9)).join('') : '<tr><td colspan="9" class="empty">No records in this view.</td></tr>'}</tbody></table></div>
      <p class="note">${ic('info', 'sm')}<span>Not in the source data: rest-break punches, and the Yes/No mark on the activity report's break question. ${R.useQB ? `Meal times exist for ${cov.withMeal} of ${cov.paidLong} paid shifts over 5 hours, including none of the ${cov.tenHour} shifts of 10 hours or more.` : ''}</span></p>
    </main>`;
  }

  /* ---------- router ---------- */
  const VIEWS = {signup: vSignup, login: vLogin, org: vOrg, connect: vConnect, agents: vAgents, run: vRun, overview: vOverview, hours: vHours, breaks: vBreaks};
  const TITLES = {signup: 'Create your account', login: 'Sign in', org: 'Organization profile', connect: 'Connect data', agents: 'Integration agents', run: 'Analyzing', overview: 'Insights', hours: 'Hours & Pay', breaks: 'Meal & Rest'};
  const bothConnected = () => AGENT_SRCS.every(k => S.conn[k]);
  const home = () => S.analysed && readiness().ok && agentsReady() ? 'overview' : bothConnected() ? 'agents' : 'connect';
  function resolve(want) {
    if (!S.user) return want === 'login' || want === 'signup' ? want : (S.account ? 'login' : 'signup');
    if (!S.org) return 'org';
    if (want === 'login' || want === 'signup') return home();
    if (want === 'agents') return bothConnected() ? 'agents' : 'connect';
    if (want === 'run') return readiness().ok && agentsReady() ? 'run' : home();
    if (['overview', 'hours', 'breaks'].includes(want) && !(S.analysed && readiness().ok && agentsReady())) return home();
    if (VIEWS[want]) return want;
    return home();
  }
  let current = null;
  function render(keepScroll) {
    const want = location.hash.replace(/^#\/?/, '').split('?')[0];
    const v = resolve(want);
    if (v !== want) { history.replaceState(null, '', `#/${v}`); }
    const changed = v !== current;
    current = v;
    if (changed) { U.errs = {}; if (v !== 'org') U.orgDraft = null; }
    // keep what the user has typed in connection forms when the same screen re-renders
    const snap = {};
    if (!changed) app.querySelectorAll('form[data-form="conn"]').forEach(f => { const o = {}; for (const el of f.elements) if (el.name) { if (el.type === 'checkbox') (o[el.name] = o[el.name] || {})[el.value] = el.checked; else o[el.name] = el.value; } snap[f.dataset.src] = o; });
    app.classList.toggle('still', !changed);
    app.innerHTML = VIEWS[v]();
    for (const [src, o] of Object.entries(snap)) { const f = app.querySelector(`form[data-form="conn"][data-src="${src}"]`); if (f) for (const el of f.elements) if (el.name && el.name in o) { if (el.type === 'checkbox') el.checked = !!o[el.name][el.value]; else el.value = o[el.name]; } }
    document.title = `${TITLES[v]} · PREMPTA AI`;
    if (changed && !keepScroll) window.scrollTo(0, 0);
    if (v === 'run' && changed) animateRun();
    if (v === 'agents' && changed) animateAgents();
    if (changed) { const h = app.querySelector('h1'); if (h) { h.setAttribute('tabindex', '-1'); if (v !== 'login' && v !== 'signup') h.focus({preventScroll: true}); } }
  }
  const go = v => { U.menu = false; if (location.hash === `#/${v}`) render(); else location.hash = `#/${v}`; };
  window.addEventListener('hashchange', () => { U.menu = false; render(); });
  const focusFirstError = () => { const b = app.querySelector('.field.bad input, .field.bad select, .field.bad'); if (b) { (b.matches('input,select') ? b : b.querySelector('input')).focus(); } };
  const clearErrors = form => { form.querySelectorAll('.field.bad').forEach(f => { f.classList.remove('bad'); const m = f.querySelector('.err'); if (m) m.remove(); }); form.querySelectorAll('[aria-invalid]').forEach(x => x.removeAttribute('aria-invalid')); U.errs = {}; };
  const formVals = form => { const v = {}; for (const el of form.elements) if (el.name && el.type !== 'checkbox') v[el.name] = el.value; return v; };

  /* ---------- actions ---------- */
  function addCases() {
    U.busy.cases = true; render(true);
    setTimeout(() => { U.busy.cases = false; S.conn.cases = true; if (!(S.sel.cases || []).length) S.sel.cases = defaults('cases'); S.analysed = false; save(); render(true); }, 500);
  }
  function connectSource(src, form) {
    const v = formVals(form), f = `cf-${src}`, e = {};
    const reports = [...form.querySelectorAll('input[name="reports"]:checked')].map(x => x.value);
    const mailbox = String(v.mailbox || '').trim().toLowerCase(), secret = String(v.secret || '');
    form.elements.secret.value = ''; // the typed credential goes no further than this line
    const stored = S.cfg[src] && S.cfg[src].credRef;
    if (!isEmail(mailbox)) e.mailbox = 'Enter a valid mailbox address.';
    else if (AGENT_SRCS.some(k => k !== src && S.cfg[k] && S.cfg[k].mailbox === mailbox)) e.mailbox = 'Each agent needs its own mailbox.';
    if (src === 'quickbooks' && !String(v.company || '').trim()) e.company = 'Enter the QuickBooks company.';
    if (!reports.length) e.reports = 'Choose at least one report.';
    if (!secret && !stored) e.secret = 'Enter the credential for this mailbox.';
    if (Object.keys(e).length) {
      if (secret && !e.secret) e.secret = 'For safety the value was cleared. Enter it again.';
      U.errs[f] = e; render(true); focusFirstError(); return;
    }
    U.errs[f] = {}; U.busy[src] = true; render(true);
    setTimeout(() => {
      const prev = S.cfg[src], cfg = {mailbox, auth: v.auth, reports, company: src === 'quickbooks' ? String(v.company).trim() : undefined,
        credRef: secret ? `vault://${slug(S.org.name)}/${src}/${hex6()}` : stored};
      const changed = !prev || secret || ['mailbox', 'auth', 'company'].some(k => prev[k] !== cfg[k]) || prev.reports.join() !== reports.join();
      S.cfg[src] = cfg; S.conn[src] = true; U.busy[src] = false; U.edit[src] = false;
      S.sel[src] = filesFor(src, reports);
      const a = S.agents[src] || {frequency: FREQ[0], schedule: AGENT[src].schedule};
      // the agent is configured from these details; any change means it is tested again
      S.agents[src] = changed ? {...a, status: 'Pending configuration', configuredAt: stamp(), lastSync: null, received: 0} : a;
      if (changed) S.analysed = false;
      save(); render(true);
    }, 700);
  }
  app.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (!t) { if (U.menu && !e.target.closest('.menu')) { U.menu = false; render(true); } return; }
    const a = t.dataset.act;
    if (a !== 'menu' && U.menu && !t.closest('.menu')) U.menu = false;
    if (a === 'theme') {
      const n = theme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', n);
      try { localStorage.setItem(THEME, n); } catch (err) { /* keep for this visit */ }
      render(true);
    } else if (a === 'menu') { U.menu = !U.menu; render(true); }
    else if (a === 'demo-signup') {
      const form = app.querySelector('form[data-form="signup"]');
      const demo = {name: 'Alex Morgan', email: 'alex.morgan@watkins.example', password: 'demo-password-2026', org: 'Watkins Environmental', legal: D.qb.meta.company};
      for (const [k, v] of Object.entries(demo)) if (!form.elements[k].value) form.elements[k].value = v;
      clearErrors(form);
    }
    else if (a === 'demo-creds') {
      app.querySelectorAll('form[data-form="conn"] input[name="secret"]').forEach(x => { if (!x.value) x.value = 'demo-app-password'; clearErrors(x.form); });
    }
    else if (a === 'edit-conn') { U.edit[t.dataset.src] = true; U.open[t.dataset.src] = false; render(true); }
    else if (a === 'cancel-edit') { U.edit[t.dataset.src] = false; U.errs[`cf-${t.dataset.src}`] = {}; render(true); }
    else if (a === 'add-cases') addCases();
    else if (a === 'browse') { U.open[t.dataset.src] = !U.open[t.dataset.src]; render(true); }
    else if (a === 'run' || a === 'rerun') { S.analysed = false; save(); go('run'); }
    else if (a === 'go') go(t.dataset.to);
    else if (a === 'signout') { delete S.user; save(); U.menu = false; go('login'); }
    else if (a === 'reset') { S = fresh(); save(); U.open = {}; U.edit = {}; U.exp.clear(); U.fA = U.fB = 'ex'; go('signup'); }
    else if (a === 'filter') { U[t.dataset.key] = U[t.dataset.key] === t.dataset.f && t.dataset.f !== 'ex' ? 'ex' : t.dataset.f; render(true); }
    else if (a === 'focus') { U[t.dataset.f[0] === 'A' ? 'fA' : 'fB'] = t.dataset.f; }
    else if (a === 'row') { const id = t.dataset.id; U.exp.has(id) ? U.exp.delete(id) : U.exp.add(id); render(true); const r = app.querySelector(`tr.row[data-id="${CSS.escape(id)}"]`); if (r) r.focus({preventScroll: true}); }
  });
  app.addEventListener('keydown', e => {
    if (e.key === 'Escape' && U.menu) { U.menu = false; render(true); return; }
    const r = e.target.closest && e.target.closest('tr.row');
    if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); r.click(); }
  });
  app.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.orgf) { // the value-source chip follows the edit, as in the organization profile
      const v = String(t.value).trim(), p = !v ? 'missing' : v === String(t.dataset.init).trim() ? t.dataset.initp : 'entered';
      const box = t.closest('.field').querySelector('.chip'); if (box) { box.className = `chip c-${p}`; box.textContent = PROV[p]; }
    }
    const f = t.closest('.field.bad'); if (f) { f.classList.remove('bad'); const m = f.querySelector('.err'); if (m) m.remove(); t.removeAttribute('aria-invalid'); }
  });
  app.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.agent) { S.agents[t.dataset.agent][t.dataset.k] = t.value; save(); return; }
    if (t.dataset.file) {
      const list = new Set(S.sel[t.dataset.src] || []);
      t.checked ? list.add(t.dataset.file) : list.delete(t.dataset.file);
      S.sel[t.dataset.src] = [...list]; S.analysed = false;
      if (S.agents[t.dataset.src]) S.agents[t.dataset.src].received = S.sel[t.dataset.src].length;
      save(); render(true);
    }
  });
  app.addEventListener('submit', e => {
    e.preventDefault();
    const form = e.target, f = form.dataset.form;
    if (f === 'login') {
      const em = document.getElementById('em').value.trim(), pw = document.getElementById('pw').value;
      const errEl = document.getElementById('lerr');
      if (!isEmail(em) || !pw) { errEl.textContent = 'Enter a work email and password.'; errEl.hidden = false; return; }
      if (S.account && S.account.email.toLowerCase() === em.toLowerCase()) S.user = {name: S.account.name, email: S.account.email};
      else { const local = em.split('@')[0].replace(/[._-]+/g, ' '); S.user = {email: em, name: local === 'demo' ? 'Demo reviewer' : local.replace(/\b\w/g, c => c.toUpperCase())}; }
      save(); go(S.org ? home() : 'org');
    } else if (f === 'signup') {
      const v = formVals(form), er = {};
      if (!v.name.trim()) er.name = 'Enter your name.';
      if (!isEmail(v.email)) er.email = 'Enter a valid work email.';
      if (v.password.length < 8) er.password = 'Use at least 8 characters.';
      if (!v.org.trim()) er.org = 'Enter the organization name.';
      if (!v.legal.trim()) er.legal = 'Enter the legal business name.';
      if (Object.keys(er).length) { U.errs.su = er; U.signup = {...v, password: ''}; render(true); focusFirstError(); return; }
      S = fresh();
      S.account = {name: v.name.trim(), email: v.email.trim().toLowerCase(), org: v.org.trim(), legal: v.legal.trim(), createdAt: stamp()};
      S.user = {name: S.account.name, email: S.account.email};
      U.signup = null; save(); go('org');
    } else if (f === 'org') {
      const v = formVals(form), er = {}, prov = {}, tips = orgInitial().tips;
      for (const fd of ORG_FIELDS) {
        const el = form.elements[fd.k], val = String(v[fd.k] || '').trim();
        if (fd.req && !val) er[fd.k] = `Enter the ${fd.l.toLowerCase().replace('organization / ', '')}.`;
        if (fd.type === 'number' && val && !/^\d+$/.test(val)) er[fd.k] = 'Enter a whole number, or leave it blank.';
        prov[fd.k] = el.closest('.field').querySelector('.chip').className.replace('chip c-', '');
      }
      if (v.contactEmail && !isEmail(v.contactEmail)) er.contactEmail = 'Enter a valid email address.';
      if (Object.keys(er).length) { U.errs.org = er; U.orgDraft = {vals: v, prov, tips}; render(true); focusFirstError(); return; }
      const vals = {}; for (const fd of ORG_FIELDS) vals[fd.k] = fd.type === 'number' ? (v[fd.k] ? Number(v[fd.k]) : null) : String(v[fd.k]).trim();
      S.org = {...vals, prov, tips, rules: 'California', complete: true};
      if (S.cfg.quickbooks && !S.cfg.quickbooks.company) S.cfg.quickbooks.company = S.org.legal;
      U.orgDraft = null; save(); go(bothConnected() ? home() : 'connect');
    } else if (f === 'conn') connectSource(form.dataset.src, form);
  });
  render();
})();

</script>
</body>
</html>
